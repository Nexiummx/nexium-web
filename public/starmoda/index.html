  /* Combina un respaldo con lo que ya hay: agrega las prendas nuevas y
     actualiza las que coinciden. Nunca borra nada. */
  function mergeBackup(d){
    var byId={}, added=0, updated=0;
    state.products.forEach(function(p){ byId[p.id]=p; });
    d.products.forEach(function(p){
      if(!p||!p.id||p.demo) return;
      var np=clone(p); delete np._t;
      (np.photos||[]).forEach(function(f){ f.url=""; });
      delete state.deleted[np.id];
      if(byId[np.id]){
        var i=state.products.indexOf(byId[np.id]);
        if(sig(byId[np.id])!==sig(np)){ state.products[i]=np; updated++; }
      } else { state.products.push(np); added++; }
    });
    if(d.vocab&&d.vocab.colors){
      var v=state.vocab;
      [["colors","n"],["cats","n"],["tags","t"]].forEach(function(x){
        var have={}; (v[x[0]]||[]).forEach(function(it){ have[it[x[1]]]=1; });
        (d.vocab[x[0]]||[]).forEach(function(it){ if(it&&!have[it[x[1]]]) v[x[0]].push(clone(it)); });
      });
      (d.vocab.fits||[]).forEach(function(f){ if(v.fits.indexOf(f)<0) v.fits.push(f); });
      Object.keys(d.vocab.systems||{}).forEach(function(k){
        if(!v.systems[k]) v.systems[k]=clone(d.vocab.systems[k]);
        else (d.vocab.systems[k]||[]).forEach(function(s){ if(v.systems[k].indexOf(s)<0) v.systems[k].push(s); });
      });
    }
    if(state.products.some(function(p){ return !p.demo; }))
      state.products=state.products.filter(function(p){ return !p.demo; });
    if(!state.products.some(function(p){ return p.id===state.active; }))
      state.active=state.products.length?state.products[0].id:null;
    save(); paintAll();
    return {added:added,updated:updated};
  }
  function importText(raw){
    var d;
    try{ d=JSON.parse(String(raw||"").replace(/^﻿/,"").trim()); }catch(e){ d=null; }
    if(!d||!Array.isArray(d.products)){ alert("No se pudo leer. Pega el respaldo completo, desde la primera { hasta la última }."); return false; }
    var r=mergeBackup(d);
    alert("Respaldo cargado: "+r.added+" prenda(s) nueva(s), "+r.updated+" actualizada(s).");
    return true;
  }

  /* ---------- códigos de barras ----------
     EAN-13 / EAN-8 / UPC-A / GTIN-14 traen un dígito de control al final:
     se verifica con pesos 3 y 1 desde la derecha, así un código mal leído
     nunca se liga a una prenda. Códigos con letras (Code 128) pasan tal cual. */
  function barcodeOk(code){
    code=String(code||"").trim();
    if(/^[0-9]+$/.test(code)){
      if(!/^(\d{8}|\d{12,14})$/.test(code)) return false;
      var d=code.split("").map(Number), chk=d.pop(), sum=0;
      d.reverse().forEach(function(n,i){ sum+=n*(i%2===0?3:1); });
      return (10-sum%10)%10===chk;
    }
    return /^[A-Za-z0-9.\-]{4,30}$/.test(code);
  }
  function barcodeIndex(){
    var idx={};
    state.products.forEach(function(p){
      if(p.demo) return;
      variantList(p).forEach(function(x){ var b=(x.v.barcode||"").trim(); if(b) (idx[b]=idx[b]||[]).push({p:p,x:x}); });
    });
    return idx;
  }

  /* ---------- reconocer estilo, color y talla de la etiqueta ----------
     Lo que la app ya conoce se toma solo; lo nuevo se pregunta una vez y se
     aprende ("MEDIUM MEDIO" = Azul medio, "7 (28)" = 28) para la próxima. */
  function norm(t){ return slug(t).replace(/-/g," ").trim().toUpperCase(); }
  function findStyle(style){
    var n=norm(style); if(!n) return null;
    return state.products.filter(function(p){ return !p.demo&&(norm(p.style)===n||norm(p.title)===n); })[0]||null;
  }
  function matchColor(raw){
    var n=norm(raw); if(!n) return "";
    var al=(V().alias&&V().alias.color)||{};
    if(al[n]&&color(al[n])) return al[n];
    var hit=V().colors.filter(function(c){ return norm(c.n)===n; })[0];
    if(hit) return hit.n;
    var toks=n.split(" ");
    hit=V().colors.filter(function(c){ return toks.indexOf(norm(c.n))>=0; })[0];
    return hit?hit.n:"";
  }
  function suggestColorName(raw){
    var t=String(raw||"").trim().split(/[\s\/]+/).filter(Boolean);
    var w=t.length>1?t[t.length-1]:(t[0]||"");
    return w?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():"";
  }
  function allSizes(){
    var out=[];
    Object.keys(V().systems).forEach(function(k){ V().systems[k].forEach(function(z){ if(out.indexOf(z)<0) out.push(z); }); });
    return out;
  }
  function sizeCandidates(raw){
    raw=String(raw||"").trim();
    var c=[raw], m=/^(.*?)\s*\((.*?)\)\s*$/.exec(raw);
    if(m) c.push(m[2].trim(),m[1].trim());
    return c.filter(Boolean);
  }
  function matchSize(raw,catName){
    var n=norm(raw); if(!n) return "";
    var al=(V().alias&&V().alias.size)||{};
    var pool=catName?sizesFor(catName):allSizes();
    if(al[n]&&pool.indexOf(al[n])>=0) return al[n];
    var c=sizeCandidates(raw);
    for(var i=0;i<c.length;i++) for(var j=0;j<pool.length;j++) if(norm(pool[j])===norm(c[i])) return pool[j];
    return "";
  }
  function suggestSize(raw){ var c=sizeCandidates(raw); return c[1]||c[0]||""; }

  /* Bip de confirmación / error (y vibración en celular). */
  var actx=null;
  function beep(ok){
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      var t=actx.currentTime;
      (ok?[[1046,0,.09]]:[[240,0,.13],[190,.17,.16]]).forEach(function(b){
        var o=actx.createOscillator(),g=actx.createGain();
        o.type=ok?"sine":"square"; o.frequency.value=b[0];
        g.gain.setValueAtTime(.14,t+b[1]); g.gain.exponentialRampToValueAtTime(.001,t+b[1]+b[2]);
        o.connect(g); g.connect(actx.destination); o.start(t+b[1]); o.stop(t+b[1]+b[2]+.02);
      });
    }catch(e){}
    if(!ok&&navigator.vibrate){ try{ navigator.vibrate(140); }catch(e){} }
  }

  /* Lector de códigos de barras en el navegador (gratis, sin internet para
     leer). Usa el del sistema si existe (Chrome en Android/Mac); si no
     (iPhone, Windows), carga el lector incluido en /starmoda/vendor. */
  var BC_FORMATS=["ean_13","ean_8","upc_a","upc_e","code_128"], detectorP=null;
  function getDetector(){
    if(detectorP) return detectorP;
    function vendor(){
      return new Promise(function(res,rej){
        if(window.BarcodeDetectionAPI) return res();
        var sc=document.createElement("script"); sc.src="/starmoda/vendor/barcode-detector-3.2.2.js";
        sc.onload=function(){ res(); }; sc.onerror=function(){ rej(new Error("No se pudo cargar el lector de códigos.")); };
        document.head.appendChild(sc);
      }).then(function(){
        var api=window.BarcodeDetectionAPI;
        api.prepareZXingModule({overrides:{locateFile:function(path,prefix){ return /\.wasm$/.test(path)?"/starmoda/vendor/zxing_reader-3.1.3.wasm":prefix+path; }}});
        return new api.BarcodeDetector({formats:BC_FORMATS});
      });
    }
    var Native=window.BarcodeDetector;
    detectorP=(typeof Native==="function"&&typeof Native.getSupportedFormats==="function"
      ? Native.getSupportedFormats().then(function(fs){
          var ok=BC_FORMATS.filter(function(x){ return fs.indexOf(x)>=0; });
          return ok.length?new Native({formats:ok}):vendor();
        },vendor)
      : vendor());
    detectorP.catch(function(){ detectorP=null; });
    return detectorP;
  }
  /* Lee el código de barras de una foto, sin IA. "" si no encuentra uno válido. */
  function barcodeFromPhoto(file){
    return Promise.all([getDetector(),loadImage(file)]).then(function(r){
      if(!r[1]) return "";
      return r[0].detect(r[1]).then(function(codes){
        var hit=(codes||[]).map(function(c){ return c.rawValue; }).filter(barcodeOk)[0];
        return hit||"";
      });
    }).catch(function(){ return ""; });
  }

  /* Foto de la etiqueta → IA → {barcode, style, color, size, brand}. */
  function readTagAI(file){
    return loadImage(file).then(function(img){
      if(!img) throw new Error("No se pudo abrir la foto (si es HEIC, usa la cámara en modo compatible).");
      var sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
      var c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      return fetch("/api/starmoda/etiqueta",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:getCode(),image:c.toDataURL("image/jpeg",.85)})});
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(t){
        if(r.ok) return t;
        var m={lectura_no_configurada:"La lectura con IA no está activada: falta ANTHROPIC_API_KEY en Vercel. Mientras, escanea el código o escribe los datos.",
          codigo_invalido:"Código de acceso no válido.",ia_ocupada:"La IA está ocupada; intenta en unos segundos.",
          imagen_muy_grande:"La foto es muy grande.",lectura_ilegible:"No se pudo leer la etiqueta; toma la foto más de cerca."};
        throw new Error(m[t.error]||("No se pudo leer la etiqueta ("+(t.error||r.status)+")."));
      });
    });
  }

  /* ---------- Recibir mercancía ----------
     Cada lectura (escáner, cámara o foto de etiqueta) suma una pieza a su
     variante. Un código nuevo se liga una sola vez a estilo + color + talla. */
  var lastRecv={style:"",color:"",size:""}, recvOpen=false;
  function receiveModal(firstCode){
    if(recvOpen) return;
    recvOpen=true; flushHistory();
    var session={pieces:0,news:0,styles:{},log:[]};
    var stats=h("div",{class:"rstats"});
    var input=h("input",{type:"text",class:"mono rinput",placeholder:"Escanea o escribe el código de barras y Enter",autocomplete:"off",inputmode:"numeric"});
    var msg=h("div",{class:"rmsg",text:"Listo para escanear. Cada lectura suma una pieza."});
    var formHost=h("div",{});
    var logEl=h("ul",{class:"rlog"});
    var video=h("video",{playsinline:"playsinline",muted:"muted",autoplay:"autoplay",class:"rvideo"});
    var camWrap=h("div",{class:"rcam",hidden:"hidden"},[video,h("div",{class:"raim"})]);
    var stream=null, det=null, pauseCam=false, lastCam={code:"",seen:0};

    function paintStats(){
      stats.innerHTML="";
      [["Piezas",session.pieces],["Estilos",Object.keys(session.styles).length],["Códigos nuevos",session.news]].forEach(function(x){
        stats.appendChild(h("div",{},[h("b",{text:String(x[1])}),h("span",{text:x[0]})]));
      });
    }
    function say(text,cls){ msg.className="rmsg "+(cls||""); msg.textContent=text; }
    function addPiece(p,x,isNew){
      var n=parseInt(x.v.qty,10); x.v.qty=String((isNaN(n)?0:n)+1); p.demo=false;
      save(); paintList();
      session.pieces++; session.styles[p.style||p.title]=1; if(isNew) session.news++;
      var li=h("li",{},[
        h("div",{},[h("b",{text:(p.style?p.style+" · ":"")+(p.title&&p.title!==p.style?p.title:"")}),
          h("small",{text:x.color+" · Talla "+x.size+" · "+(x.v.barcode||"")+(isNew?" · nuevo":"")})]),
        h("span",{class:"chip ok",text:x.v.qty+" pz"})
      ]);
      logEl.insertBefore(li,logEl.firstChild);
      session.log.push({p:p,key:x.key,li:li,isNew:isNew});
      paintStats(); beep(true);
      say("+1  "+(p.style||p.title)+" · "+x.color+" · "+x.size+"  →  "+x.v.qty+(x.v.qty==="1"?" pieza":" piezas"),"ok");
    }
    function undoLast(){
      var e=session.log.pop(); if(!e){ say("No hay lecturas que quitar.",""); return; }
      var v=e.p.variants[e.key];
      if(v){ v.qty=String(Math.max(0,(parseInt(v.qty,10)||0)-1)); save(); paintList(); }
      e.li.remove(); session.pieces=Math.max(0,session.pieces-1); if(e.isNew) session.news=Math.max(0,session.news-1);
      paintStats(); say("Se quitó la última pieza.",""); input.focus();
    }
    function handle(code,reading){
      code=String(code||"").replace(/\s+/g,"");
      if(!code){ if(reading) newForm("",reading); return; }
      if(!barcodeOk(code)){ beep(false); say("El código "+code+" no es válido: su dígito verificador no cuadra. Vuelve a escanearlo.","err"); return; }
      var hit=barcodeIndex()[code];
      if(hit&&hit.length){ formHost.innerHTML=""; pauseCam=false; addPiece(hit[0].p,hit[0].x,false); return; }
      newForm(code,reading);
    }

    function newForm(code,reading){
      pauseCam=true;
      var r=reading||{}, fromTag=!!reading, colorRaw=r.color||"", sizeRaw=r.size||"";
      formHost.innerHTML="";
      var codeIn=h("input",{type:"text",class:"mono",value:code,placeholder:"Código de barras",inputmode:"numeric"});
      var styleIn=h("input",{type:"text",class:"mono",value:r.style||lastRecv.style,placeholder:"BL7571",list:"rstyles",autocomplete:"off"});
      var dl=h("datalist",{id:"rstyles"});
      state.products.forEach(function(p){ if(!p.demo&&p.style) dl.appendChild(h("option",{value:p.style,label:p.title})); });
      var nameIn=h("input",{type:"text",placeholder:"Ej. Jeans Mom Fit Medio"});
      var catSel=h("select",{}); catSel.appendChild(h("option",{value:"",text:"Elegir…"}));
      V().cats.forEach(function(c){ catSel.appendChild(h("option",{value:c.n,text:c.n,selected:c.n==="Jeans"?"selected":null})); });
      var colorSel=h("select",{}), sizeSel=h("select",{});
      var newColorIn=h("input",{type:"text",value:suggestColorName(colorRaw),placeholder:"Nombre del color"});
      var newColorHex=h("input",{type:"color",value:"#5b6f95"});
      var newSizeIn=h("input",{type:"text",class:"mono",value:suggestSize(sizeRaw),placeholder:"Talla"});
      var info=h("div",{class:"rinfo"});
      var newProdRow=h("div",{class:"row two"},[field("Nombre de la prenda","",nameIn),field("Categoría","",catSel)]);
      var newColorRow=h("div",{class:"row two"},[field("Color nuevo","",newColorIn),field("Tono","",newColorHex)]);
      var newSizeRow=h("div",{class:"row"},[field("Talla nueva","",newSizeIn)]);
      function refresh(){
        var p=findStyle(styleIn.value);
        newProdRow.style.display=p||!styleIn.value.trim()?"none":"";
        info.textContent=p?("Prenda encontrada: "+(p.title||p.style)+". Se agrega a sus variantes."):(styleIn.value.trim()?"Estilo nuevo: se crea la prenda.":"Escribe el estilo de la etiqueta.");
        var catName=p?p.category:catSel.value;
        var cv=colorSel.value&&colorSel.value!=="__new"?colorSel.value:(matchColor(colorRaw)||(fromTag?"":lastRecv.color));
        colorSel.innerHTML="";
        V().colors.forEach(function(c){ colorSel.appendChild(h("option",{value:c.n,text:c.n,selected:c.n===cv?"selected":null})); });
        colorSel.appendChild(h("option",{value:"__new",text:"+ Color nuevo…",selected:cv?null:"selected"}));
        newColorRow.style.display=colorSel.value==="__new"?"":"none";
        var pool=catName?sizesFor(catName):allSizes();
        var sv=sizeSel.value&&sizeSel.value!=="__new"&&pool.indexOf(sizeSel.value)>=0?sizeSel.value:(matchSize(sizeRaw,catName)||(!fromTag&&pool.indexOf(lastRecv.size)>=0?lastRecv.size:""));
        sizeSel.innerHTML="";
        pool.forEach(function(z){ sizeSel.appendChild(h("option",{value:z,text:z,selected:z===sv?"selected":null})); });
        sizeSel.appendChild(h("option",{value:"__new",text:"+ Talla nueva…",selected:sv?null:"selected"}));
        newSizeRow.style.display=sizeSel.value==="__new"?"":"none";
      }
      styleIn.addEventListener("input",refresh); catSel.addEventListener("change",refresh);
      colorSel.addEventListener("change",refresh); sizeSel.addEventListener("change",refresh);
      function submit(){
        var bc=codeIn.value.replace(/\s+/g,"");
        if(!bc){ say("Falta el código de barras.","err"); codeIn.focus(); return; }
        if(!barcodeOk(bc)){ beep(false); say("Ese código no es válido: su dígito verificador no cuadra.","err"); codeIn.focus(); return; }
        var ex=barcodeIndex()[bc];
        if(ex&&ex.length){ formHost.innerHTML=""; pauseCam=false; addPiece(ex[0].p,ex[0].x,false); input.focus(); return; }
        var st=styleIn.value.trim().toUpperCase();
        if(!st){ say("Escribe el estilo de la etiqueta.","err"); styleIn.focus(); return; }
        var cName=colorSel.value==="__new"?newColorIn.value.trim():colorSel.value;
        var sName=sizeSel.value==="__new"?newSizeIn.value.trim():sizeSel.value;
        if(!cName){ say("Elige o escribe el color.","err"); return; }
        if(!sName){ say("Elige o escribe la talla.","err"); return; }
        var p=findStyle(st), created=false, v=V();
        if(!p){
          state.products=state.products.filter(function(x){ return !x.demo; });
          p=blank(); p.style=st; p.title=nameIn.value.trim()||st; p.category=catSel.value;
          if(r.brand) p.vendor=r.brand;
          state.products.push(p); created=true;
        }
        if(created||!state.products.some(function(x){ return x.id===state.active; })) state.active=p.id;
        if(!color(cName)) v.colors.push({n:cName,hex:newColorHex.value,ab:(abbr(cName)||"COL").slice(0,4),tema:false,nuevo:true});
        var order=sizesFor(p.category);
        if(order.indexOf(sName)<0){
          var sys=(cat(p.category)&&cat(p.category).sys)||"Letras";
          if(!v.systems[sys]) v.systems[sys]=[];
          v.systems[sys].push(sName); order=sizesFor(p.category);
        }
        if(colorRaw||sizeRaw){
          if(!v.alias||typeof v.alias!=="object") v.alias={};
          v.alias.color=v.alias.color||{}; v.alias.size=v.alias.size||{};
          if(colorRaw&&norm(colorRaw)!==norm(cName)) v.alias.color[norm(colorRaw)]=cName;
          if(sizeRaw&&norm(sizeRaw)!==norm(sName)) v.alias.size[norm(sizeRaw)]=sName;
        }
        if(p.colors.indexOf(cName)<0) p.colors.push(cName);
        if(p.sizes.indexOf(sName)<0){ p.sizes.push(sName); p.sizes.sort(function(a,z){ return order.indexOf(a)-order.indexOf(z); }); }
        syncVariants(p);
        var x=variantList(p).filter(function(y){ return y.color===cName&&y.size===sName; })[0];
        if(x.v.barcode&&x.v.barcode!==bc&&!confirm("Esa variante ya tiene el código "+x.v.barcode+". ¿Reemplazarlo por "+bc+"?")) return;
        x.v.barcode=bc;
        lastRecv={style:p.style||st,color:cName,size:sName};
        formHost.innerHTML=""; pauseCam=false;
        addPiece(p,x,true);
        if(created) toast("Prenda nueva: "+p.title);
        input.focus();
      }
      [codeIn,styleIn,nameIn,newColorIn,newSizeIn].forEach(function(el){ el.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); submit(); } }); });
      formHost.appendChild(h("div",{class:"rnew"},[
        h("div",{class:"rnew-h"},[h("b",{text:fromTag?"Etiqueta leída":"Código nuevo"}),
          h("span",{text:fromTag?("Leído: "+[r.style,r.color,r.size].filter(Boolean).join(" · ")):"Dime a qué prenda, color y talla pertenece. Solo se pregunta una vez."})]),
        h("div",{class:"row two"},[field("Código de barras","",codeIn),field("Estilo (de la etiqueta)","",styleIn)]),
        dl, info, newProdRow,
        h("div",{class:"row two"},[field("Color"+(colorRaw?" · etiqueta: "+colorRaw:""),"",colorSel),field("Talla"+(sizeRaw?" · etiqueta: "+sizeRaw:""),"",sizeSel)]),
        newColorRow, newSizeRow,
        h("div",{class:"actions"},[
          ibtn("primary","check","Ligar y sumar 1 pieza",submit),
          h("button",{class:"ghost",text:"Cancelar",onclick:function(){ formHost.innerHTML=""; pauseCam=false; say("Cancelado.",""); input.focus(); }})
        ])
      ]));
      refresh();
      setTimeout(function(){ (code?(styleIn.value?colorSel:styleIn):codeIn).focus(); },30);
    }

    /* cámara: lector de código en vivo (Chrome / Android) */
    var camBtn=ibtn("","camera","Escanear con cámara",function(){ if(stream) stopCam(); else startCam(); });
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ camBtn.disabled=true; camBtn.title="Este navegador no da acceso a la cámara."; }
    function startCam(){
      say("Abriendo la cámara…","");
      getDetector().then(function(d){
        det=d;
        return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
      }).then(function(s){
        say("Apunta al código de barras dentro del recuadro.","");
        stream=s; video.srcObject=s; camWrap.hidden=false; video.play().catch(function(){});
        camBtn.querySelector("span").textContent="Apagar cámara"; loop();
      }).catch(function(e){ say((e&&/lector/.test(e.message))?e.message:"No se pudo abrir la cámara. Revisa el permiso del navegador.","err"); });
    }
    function loop(){
      if(!stream) return;
      if(pauseCam||video.readyState<2){ setTimeout(loop,300); return; }
      /* La misma etiqueta cuenta otra vez solo si salió del cuadro (1.5 s sin
         verla) y regresó: dejar la cámara quieta no suma piezas de más. */
      det.detect(video).then(function(codes){
        var c=codes&&codes.length?codes[0].rawValue:"", now=Date.now();
        if(!c) return;
        var repeat=c===lastCam.code&&now-lastCam.seen<1500;
        lastCam.seen=now;
        if(repeat) return;
        lastCam.code=c; handle(c);
      }).catch(function(){}).then(function(){ setTimeout(loop,250); });
    }
    function stopCam(){
      if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
      stream=null; camWrap.hidden=true; camBtn.querySelector("span").textContent="Escanear con cámara";
    }

    /* foto de la etiqueta → IA */
    var photoIn=h("input",{type:"file",accept:"image/*",capture:"environment",style:"display:none"});
    var tagBtn=ibtn("","image","Leer etiqueta con foto",function(){ photoIn.click(); });
    if(!visionOn) tagBtn.title="Requiere ANTHROPIC_API_KEY en Vercel";
    photoIn.addEventListener("change",function(){
      var file=photoIn.files[0]; photoIn.value=""; if(!file) return;
      tagBtn.disabled=true; say("Buscando el código en la foto…","");
      barcodeFromPhoto(file).then(function(local){
        if(local&&barcodeIndex()[local]){ handle(local); return null; }   /* conocido: sin IA */
        if(!visionOn){
          if(local){ say("Código leído de la foto. Es nuevo: dime a qué prenda pertenece.",""); newForm(local,null); }
          else { beep(false); say("No encontré un código en la foto. Acércala o usa el escáner. (La lectura con IA no está activada.)","err"); }
          return null;
        }
        say("Leyendo estilo, color y talla…","");
        return readTagAI(file).then(function(t){ if(local) t.barcode=local; return t; });
      }).then(function(t){
        if(!t) return;
        var bc=(t.barcode||"").replace(/\D/g,"");
        if(bc&&!barcodeOk(bc)){ beep(false); say("La IA leyó el código "+bc+" pero no pasa el dígito verificador: corrígelo abajo.","err"); newForm(bc,t); return; }
        if(bc&&barcodeIndex()[bc]){ handle(bc,t); return; }
        say("Etiqueta leída. Confirma los datos.",""); newForm(bc,t);
      }).catch(function(e){ beep(false); say(e.message,"err"); }).then(function(){ tagBtn.disabled=false; });
    });

    input.addEventListener("keydown",function(e){
      if(e.key!=="Enter") return;
      e.preventDefault(); var c=input.value; input.value=""; handle(c);
    });
    paintStats();
    var veil=modal("Recibir mercancía",[
      stats,
      h("div",{class:"rscan"},[input,camBtn,tagBtn,photoIn]),
      msg, camWrap, formHost,
      h("div",{class:"rlog-h"},[h("b",{text:"Lecturas de esta sesión"})]),
      logEl
    ],[h("button",{class:"ghost",text:"Deshacer última",onclick:undoLast})]);
    veil.querySelector(".modal").classList.add("wide");
    var obs=new MutationObserver(function(){
      if(veil.isConnected) return;
      obs.disconnect(); stopCam(); recvOpen=false; paintAll();
      if(session.pieces) toast(session.pieces+(session.pieces===1?" pieza recibida":" piezas recibidas")+". Recuerda guardar en la nube.");
    });
    obs.observe(document.body,{childList:true});
    setTimeout(function(){ input.focus(); if(firstCode) handle(firstCode); },60);
  }

  /* ---------- arranque ---------- */
  function paintAll(){ paintList(); paintForm(); }

  Array.prototype.forEach.call(document.querySelectorAll("button[data-ic]"),function(b){ b.insertBefore(icon(b.getAttribute("data-ic")),b.firstChild); });
  document.getElementById("btnAdd").addEventListener("click",newProduct);
  document.getElementById("pSearch").addEventListener("input",paintList);
  document.getElementById("btnExport").addEventListener("click",exportModal);
  document.getElementById("btnUndo").addEventListener("click",undo);
  document.getElementById("btnRedo").addEventListener("click",redo);
  document.getElementById("btnHist").addEventListener("click",historyModal);
  document.getElementById("btnSave").addEventListener("click",cloudSave);
  document.getElementById("btnRecv").addEventListener("click",function(){ receiveModal(); });
  /* Escáner USB/Bluetooth: "teclea" muy rápido y da Enter. Si llega una
     ráfaga así fuera de un campo de texto, se abre Recibir con ese código. */
  var kb={buf:"",t:0};
  document.addEventListener("keydown",function(e){
    if(recvOpen||e.ctrlKey||e.metaKey||e.altKey) return;
    var t=e.target;
    if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)) return;
    var now=Date.now();
    if(e.key==="Enter"){
      if(kb.buf.length>=6&&now-kb.t<120){ e.preventDefault(); var c=kb.buf; kb.buf=""; receiveModal(c); }
      kb.buf=""; return;
    }
    if(e.key&&e.key.length===1){ if(now-kb.t>80) kb.buf=""; kb.buf+=e.key; kb.t=now; }
  });
  var menuPop=document.getElementById("menuPop");
  function closeMenu(){ menuPop.hidden=true; }
  document.getElementById("btnMenu").addEventListener("click",function(e){ e.stopPropagation(); menuPop.hidden=!menuPop.hidden; });
  document.addEventListener("click",function(e){ if(!menuPop.hidden&&!menuPop.contains(e.target)) closeMenu(); });
  [["btnConn",function(){ connModal(); }],["btnBackup",backupModal],["btnGuide",guideModal],["btnVocab",function(){ vocabModal(null); }]].forEach(function(x){
    document.getElementById(x[0]).addEventListener("click",function(){ closeMenu(); x[1](); });
  });
  /* Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y: dentro de un campo de texto manda el
     deshacer del propio campo; fuera, el del catálogo. */
  document.addEventListener("keydown",function(e){
    if(!(e.ctrlKey||e.metaKey)) return;
    var t=e.target, typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
    if(typing) return;
    var k=(e.key||"").toLowerCase();
    if(k==="z"&&!e.shiftKey){ e.preventDefault(); undo(); }
    else if((k==="z"&&e.shiftKey)||k==="y"){ e.preventDefault(); redo(); }
    else if(k==="s"){ e.preventDefault(); cloudSave(); }
  });
  /* Aviso al cerrar con cambios sin subir (lo capturado sigue guardado
     aquí; el aviso es para que no se olvide subirlo). */
  window.addEventListener("beforeunload",function(e){
    flushHistory();
    if(remoteOn()&&getCode()&&pendingInfo().total){ e.preventDefault(); e.returnValue=""; }
  });

  load(); primeSigs(); paintAll(); paintSaved();
  loadHistory().then(function(){ hydratePhotos(); gcBlobs(); });
  if(remoteOn()){
    /* Al abrir solo trae lo que otros guardaron; no sube nada. */
    remoteSync().catch(function(){}).then(paintCloud);
    refreshPhotoStatus();
    var syncEl=document.getElementById("sync");
    syncEl.style.cursor="pointer";
    syncEl.title="Ver la conexión";
    syncEl.addEventListener("click",function(){ if(getCode()) connModal(); else codeModal(); });
  } else cloudInit();
  paintCloud();
  if(!storageOK) setTimeout(function(){ alert("Este navegador no permite guardar automáticamente. Exporta un respaldo seguido para no perder el trabajo."); },400);
})();

</script>

</body></html>
