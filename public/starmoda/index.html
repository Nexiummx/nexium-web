<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Captura Star Moda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ============ sistema de diseño ============ */
  :root{
    color-scheme:light;
    --bg:#f3f2f5; --surface:#ffffff; --surface-2:#faf9fb; --sunk:#f1f0f4; --raise:#ffffff;
    --line:#e5e3ea; --line-soft:#efedf2; --ink:#16141a; --ink-2:#4b4853; --muted:#85818e;
    --accent:#b4285c; --accent-2:#d9467c; --accent-soft:#fbe9f0; --accent-ink:#ffffff;
    --req:#e0444f; --req-soft:#fdecec; --rec:#e09b1a; --rec-soft:#fdf4e2; --ok:#1f9d63; --ok-soft:#e5f6ee; --opt:#a3a0ab;
    --gold:#d6a43f; --gold-soft:#fbf3e1;
    --shadow-sm:0 1px 2px rgba(22,20,26,.05);
    --shadow:0 1px 2px rgba(22,20,26,.04),0 6px 20px -6px rgba(22,20,26,.08);
    --shadow-lg:0 24px 60px -12px rgba(22,20,26,.28);
    --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
    --body:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    /* alias que usa el código de la app */
    --ground:var(--bg); --mocha:var(--accent); --beige:var(--line); --display:var(--body);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e0d11; --surface:#17161b; --surface-2:#1c1b21; --sunk:#222128; --raise:#1c1b21;
    --line:#2c2a33; --line-soft:#24232a; --ink:#f3f1f6; --ink-2:#c6c3cd; --muted:#8f8b99;
    --accent:#ef6b98; --accent-2:#f48bb0; --accent-soft:rgba(239,107,152,.14); --accent-ink:#1a0b11;
    --req:#ff6b72; --req-soft:rgba(255,107,114,.12); --rec:#f2b544; --rec-soft:rgba(242,181,68,.12); --ok:#3ccf8e; --ok-soft:rgba(60,207,142,.12); --opt:#77737f;
    --gold:#e8b85a; --gold-soft:rgba(232,184,90,.14);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -8px rgba(0,0,0,.5); --shadow-lg:0 30px 70px -10px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e0d11; --surface:#17161b; --surface-2:#1c1b21; --sunk:#222128; --raise:#1c1b21;
    --line:#2c2a33; --line-soft:#24232a; --ink:#f3f1f6; --ink-2:#c6c3cd; --muted:#8f8b99;
    --accent:#ef6b98; --accent-2:#f48bb0; --accent-soft:rgba(239,107,152,.14); --accent-ink:#1a0b11;
    --req:#ff6b72; --req-soft:rgba(255,107,114,.12); --rec:#f2b544; --rec-soft:rgba(242,181,68,.12); --ok:#3ccf8e; --ok-soft:rgba(60,207,142,.12); --opt:#77737f;
    --gold:#e8b85a; --gold-soft:rgba(232,184,90,.14);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -8px rgba(0,0,0,.5); --shadow-lg:0 30px 70px -10px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{margin:0;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent-soft);}
  svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* botones */
  button{font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:9px 14px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1.2;
    box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .05s;}
  button:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line));background:var(--surface-2);}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px -6px color-mix(in srgb,var(--accent) 60%,transparent);}
  button.primary:hover{background:var(--accent-2);border-color:var(--accent-2);}
  button.ghost{background:transparent;box-shadow:none;}
  button.ghost:hover{background:var(--sunk);}
  button.danger:hover{border-color:var(--req);color:var(--req);background:var(--req-soft);}
  button[disabled]{opacity:.45;cursor:not-allowed;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* barra superior */
  .top{display:flex;align-items:center;gap:10px;padding:12px 22px;background:color-mix(in srgb,var(--surface) 86%,transparent);
    backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap;min-height:64px;}
  .brand{display:flex;align-items:center;gap:11px;margin-right:6px;}
  .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,var(--accent) 0%,#e2789e 55%,var(--gold) 120%);box-shadow:0 6px 16px -6px var(--accent);}
  .logo svg{width:18px;height:18px;fill:#fff;stroke:none;}
  .mark{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
  .mark em{font-style:normal;color:var(--accent);}
  .mark small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0;}
  .top .sep{flex:1;}
  .saved{font-size:12px;color:var(--muted);white-space:nowrap;}
  .saved b{color:var(--ok);font-weight:600;}
  .sync{font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
    padding:6px 11px 6px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line-soft);}
  .sync:empty{display:none;}
  .sync b{font-size:0;width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
  .sync.up b{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);}
  .sync.down b{background:var(--req);box-shadow:0 0 0 3px var(--req-soft);}
  .sync.local b{background:var(--rec);}
  .top .tb{display:flex;gap:6px;flex-wrap:wrap;}

  button.icon{padding:9px;}
  .seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--surface);}
  .seg button{border:0;box-shadow:none;padding:6px 9px;}
  .seg button.icon{padding:6px;}
  #btnSave .badge{font-style:normal;font-size:11px;font-weight:800;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#fff;color:var(--accent);display:none;align-items:center;justify-content:center;}
  #btnSave.dirty .badge{display:inline-flex;}
  #btnSave:not(.dirty){background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-sm);}
  #btnSave:not(.dirty):hover{background:var(--surface-2);}
  .menu{position:relative;}
  .menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:40;animation:pop .14s ease-out;}
  .menu-pop[hidden]{display:none;}
  .menu-pop button{justify-content:flex-start;width:100%;border:0;padding:9px 10px;}
  .hist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-height:56vh;overflow-y:auto;}
  .hist li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line-soft);}
  .hist li:last-child{border-bottom:0;}
  .hist li b{display:block;font-size:13.5px;font-weight:600;line-height:1.35;}
  .hist li small{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
  .hist li.on{background:var(--accent-soft);}
  .hist li.future{opacity:.6;}
  .hist li button{padding:6px 11px;font-size:12.5px;flex:none;}

  input.bc{font-family:var(--mono);font-size:12.5px;min-width:150px;}
  input.bc.bad{border-color:var(--req);background:var(--req-soft);}
  .modal.wide{max-width:780px;}
  .rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .rstats div{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2);}
  .rstats b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
  .rstats span{font-size:12px;color:var(--muted);}
  .rscan{display:flex;gap:8px;flex-wrap:wrap;}
  .rscan .rinput{flex:1 1 260px;font-size:17px;padding:12px 14px;letter-spacing:.04em;}
  .rmsg{margin:10px 0 12px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13.5px;font-weight:600;color:var(--ink-2);}
  .rmsg.ok{background:var(--ok-soft);color:var(--ok);}
  .rmsg.err{background:var(--req-soft);color:var(--req);}
  .rcam{position:relative;border-radius:var(--r);overflow:hidden;background:#000;margin-bottom:12px;max-height:300px;}
  .rcam[hidden]{display:none;}
  .rvideo{width:100%;max-height:300px;object-fit:cover;display:block;}
  .raim{position:absolute;left:12%;right:12%;top:42%;height:16%;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.25);}
  .rnew{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-soft);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;}
  .rnew .row{margin-bottom:10px;}
  .rnew input,.rnew select{background:var(--surface);}
  .rnew-h{margin-bottom:10px;}
  .rnew-h b{display:block;font-size:15px;}
  .rnew-h span{font-size:12.5px;color:var(--ink-2);}
  .rinfo{font-size:12.5px;font-weight:600;color:var(--accent);margin:-2px 0 10px;}
  .rlog-h{margin:6px 0 6px;font-size:13px;}
  .rlog{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);max-height:220px;overflow-y:auto;}
  .rlog:empty{display:none;}
  .rlog li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-soft);}
  .rlog li:last-child{border-bottom:0;}
  .rlog b{display:block;font-size:13px;}
  .rlog small{font-size:12px;color:var(--muted);font-family:var(--mono);}
  /* estructura */
  .shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 64px);}
  aside{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:64px;height:calc(100vh - 64px);}
  .progress{padding:20px 20px 16px;}
  .progress .lbl{font-size:12px;font-weight:600;color:var(--muted);}
  .progress .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:2px;}
  .progress .big span{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;}
  .progress p{margin:4px 0 12px;font-size:12.5px;color:var(--ink-2);}
  .bar{height:6px;background:var(--sunk);overflow:hidden;border-radius:999px;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1);}
  .totals{display:flex;gap:6px;margin-top:12px;font-size:12px;color:var(--muted);}
  .search{padding:0 16px 12px;position:relative;}
  .search svg{position:absolute;left:28px;top:11px;color:var(--muted);pointer-events:none;}
  .search input[type=search]{padding-left:38px;}
  .plist{flex:1;overflow-y:auto;padding:4px 10px 10px;border-top:1px solid var(--line-soft);}
  .pitem{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;padding:9px 10px;border-radius:var(--r);cursor:pointer;align-items:center;margin-top:4px;border:1px solid transparent;transition:background .12s;}
  .pitem:hover{background:var(--sunk);}
  .pitem.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent);}
  .pthumb{width:42px;height:54px;border-radius:9px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--muted);border:1px solid var(--line-soft);}
  .pthumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .pitem b{font-weight:700;font-size:13.5px;display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pitem small{color:var(--muted);font-size:12px;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .chip.ok{background:var(--ok-soft);color:var(--ok);} .chip.rec{background:var(--rec-soft);color:var(--rec);} .chip.req{background:var(--req-soft);color:var(--req);}
  .addwrap{padding:14px 16px;border-top:1px solid var(--line);}
  .addwrap button{width:100%;padding:11px 14px;}
  .noresults{padding:16px 10px;font-size:12.5px;color:var(--muted);text-align:center;}

  main{overflow-x:hidden;overflow-x:clip;}
  .pad{padding:26px 30px 90px;max-width:1240px;margin:0 auto;}
  .empty{padding:90px 30px;text-align:center;color:var(--muted);}
  .empty .eic{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 18px;}
  .empty .eic svg{width:28px;height:28px;}
  .empty h2{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:0 0 6px;}
  .empty p{margin:0 0 20px;}

  .formgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start;}

  /* secciones como tarjetas */
  fieldset{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:22px 24px 24px;margin:0 0 18px;box-shadow:var(--shadow);min-width:0;scroll-margin-top:150px;}
  legend{float:left;width:100%;padding:0;margin:0 0 16px;display:flex;align-items:center;gap:12px;}
  legend + *{clear:both;}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:999px;display:inline-block;white-space:nowrap;}
  .secttl{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.2;}
  .hint{font-size:13px;color:var(--muted);margin:-8px 0 18px;max-width:70ch;clear:both;}

  .row{display:grid;gap:16px;margin-bottom:16px;}
  .row.two{grid-template-columns:1fr 1fr;}
  .row.three{grid-template-columns:1fr 1fr 1fr;}
  label.f{display:block;}
  label.f > span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
  label.f > span i{font-style:normal;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;line-height:1.5;}
  label.f > span i.req{color:var(--req);background:var(--req-soft);} label.f > span i.rec{color:var(--rec);background:var(--rec-soft);} label.f > span i.opt{color:var(--muted);background:var(--sunk);}
  label.f > span i.req::after{content:"Obligatorio";font-size:10px;margin-left:3px;} label.f > span i.rec::after{content:"Recomendado";margin-left:3px;} label.f > span i.opt::after{content:"Opcional";margin-left:3px;}
  input[type=text],input[type=number],input[type=search],textarea,select{
    width:100%;font-family:var(--body);font-size:14px;color:var(--ink);background:var(--raise);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s,box-shadow .15s;}
  input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent);}
  input:hover,textarea:hover,select:hover{border-color:color-mix(in srgb,var(--ink) 18%,var(--line));}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  textarea{resize:vertical;min-height:84px;line-height:1.5;}
  .mono input,input.mono{font-family:var(--mono);font-size:12.5px;}
  .cnt{font-size:12px;color:var(--muted);margin-top:6px;}
  .cnt.over{color:var(--req);}

  /* chips de selección */
  .picks{display:flex;flex-wrap:wrap;gap:8px;}
  .pick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:7px 14px 7px 10px;cursor:pointer;font-size:13px;font-weight:500;user-select:none;border-radius:999px;transition:all .12s;}
  .pick:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line));transform:translateY(-1px);}
  .pick.on{border-color:var(--ink);background:var(--ink);color:var(--bg);box-shadow:var(--shadow);}
  .pick .sw{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none;}
  .pick.on .sw{box-shadow:0 0 0 2px var(--bg);}
  .pick.sz{font-family:var(--mono);font-size:12.5px;font-weight:500;min-width:48px;justify-content:center;border-radius:10px;padding:8px 12px;}
  .pick.isnew{border-style:dashed;}
  .pick.isnew.on{border-style:solid;}

  /* variantes */
  .bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-bottom:0;background:var(--surface-2);font-size:13px;font-weight:500;color:var(--ink-2);border-radius:var(--r) var(--r) 0 0;}
  .bulk input{width:92px;padding:7px 10px;}
  .bulk button{padding:7px 12px;}
  .vtable{border:1px solid var(--line);background:var(--surface);overflow-x:auto;border-radius:0 0 var(--r) var(--r);}
  table{border-collapse:collapse;width:100%;min-width:720px;font-size:13px;}
  .vtable td input.mono{min-width:170px;}
  th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;}
  td{padding:7px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:hover td{background:var(--surface-2);}
  tr:last-child td{border-bottom:0;}
  td input{padding:7px 9px;}
  td.num input{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;max-width:110px;margin-left:auto;display:block;}
  .vcolor{display:flex;align-items:center;gap:9px;white-space:nowrap;font-weight:500;}
  .vcolor .sw{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none;}
  .vsize{font-family:var(--mono);font-size:12.5px;font-weight:500;}
  .zero{color:var(--req);}
  tfoot td{background:var(--surface-2);font-weight:700;border-top:1px solid var(--line);font-size:12.5px;}

  /* fotos */
  .drop{border:1.5px dashed color-mix(in srgb,var(--ink) 18%,var(--line));background:var(--surface-2);padding:28px 20px;text-align:center;border-radius:var(--r-lg);transition:all .15s;}
  .drop .dic{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px;}
  .drop .dic svg{width:22px;height:22px;}
  .drop.hot{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.005);}
  .drop.busy{opacity:.7;pointer-events:none;}
  .drop p{margin:0 auto 14px;font-size:13.5px;color:var(--ink-2);max-width:56ch;}
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:16px;}
  .shot{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .15s,opacity .15s;}
  .shot:hover{box-shadow:var(--shadow);}
  .shot.busy{opacity:.55;}
  .shot .thumb{aspect-ratio:3/4;background:var(--sunk);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;}
  .shot .thumb img{width:100%;height:100%;object-fit:cover;display:block;}

    p.care="Lavar a mano con agua fría\nNo usar secadora\nPlanchar a temperatura baja";
    p.modelInfo="La modelo mide 1.68 m y usa talla S";
    syncVariants(p);
    var q={"Crema|S":3,"Crema|M":5,"Crema|L":2,"Negro|S":4,"Negro|M":6,"Negro|L":1};
    Object.keys(p.variants).forEach(function(k){ p.variants[k].qty=q[k]!=null?String(q[k]):"0"; });
    return p;
  }
  function freshVocab(){ return clone(BUILTIN); }

  function adopt(d){
    state.products = Array.isArray(d.products)?d.products:[];
    state.vocab = d.vocab && d.vocab.colors ? d.vocab : freshVocab();
    ["colors","cats","tags","fits"].forEach(function(k){ if(!Array.isArray(state.vocab[k])) state.vocab[k]=clone(BUILTIN[k]); });
    if(!state.vocab.systems || typeof state.vocab.systems!=="object") state.vocab.systems=clone(BUILTIN.systems);
    state.products.forEach(function(p){ (p.photos||[]).forEach(function(f){ f.url=""; }); });
    state.active = state.products.length?state.products[0].id:null;
    state.vocabT = +d.vocabT||0;
    state.deleted = d.deleted && typeof d.deleted==="object" ? d.deleted : {};
  }

  function load(){
    var raw=null;
    try{ raw=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY); }catch(e){ storageOK=false; }
    if(raw){
      try{
        var d=JSON.parse(raw);
        if(d&&Array.isArray(d.products)){ adopt(d); return; }
      }catch(e){}
    }
    state.vocab=freshVocab();
    var s=seed(); state.products=[s]; state.active=s.id;
  }

  function payload(){
    var clean=clone(state.products);
    clean.forEach(function(p){ (p.photos||[]).forEach(function(f){ delete f.url; }); });
    return {version:2,exportedAt:new Date().toISOString(),vocab:state.vocab,products:clean,
      vocabT:state.vocabT,deleted:state.deleted};
  }

  /* Firma estable de una prenda o del vocabulario: llaves ordenadas, sin la
     URL temporal de las fotos ni la marca de tiempo. Sirve para saber qué
     cambió de verdad y qué ya está en la nube. */
  function stable(o){
    if(Array.isArray(o)) return "["+o.map(stable).join(",")+"]";
    if(o&&typeof o==="object") return "{"+Object.keys(o).sort().map(function(k){ return JSON.stringify(k)+":"+stable(o[k]); }).join(",")+"}";
    return JSON.stringify(o===undefined?null:o);
  }
  function strip(p){ var c=clone(p); delete c._t; (c.photos||[]).forEach(function(f){ delete f.url; }); return c; }
  function sig(p){ return stable(strip(p)); }

  /* Marca con la hora cada cambio real hecho en este navegador. */
  var localSig={}, localVocabSig=null;
  function primeSigs(){
    localSig={};
    state.products.forEach(function(p){ if(!p.demo) localSig[p.id]=sig(p); });
    localVocabSig=stable(state.vocab);
  }
  function stampChanges(){
    var now=Date.now(), here={};
    state.products.forEach(function(p){
      if(p.demo) return;
      here[p.id]=1;
      var s=sig(p);
      if(localSig[p.id]!==s){ p._t=now; localSig[p.id]=s; delete state.deleted[p.id]; }
    });
    Object.keys(localSig).forEach(function(id){
      if(!here[id]){ state.deleted[id]=now; delete localSig[id]; }
    });
    var vs=stable(state.vocab);
    if(vs!==localVocabSig){ state.vocabT=now; localVocabSig=vs; }
  }
  function persist(){
    try{ localStorage.setItem(KEY,JSON.stringify(payload())); }catch(e){ storageOK=false; }
  }

  /* Guardar = guardar en este navegador. La nube solo se toca con el botón
     "Guardar en la nube" (o al abrir la app, para traer lo de otros). */
  function save(){
    savedAt=new Date();
    stampChanges();
    persist();
    paintSaved();
    cloudQueue();
    recordHistory();
    paintCloud();
  }
  function paintSaved(){
    var el=document.getElementById("saved");
    if(!storageOK){ el.innerHTML='<b style="color:var(--req)">Sin guardado automático</b>'; return; }
    if(!savedAt){ el.textContent=""; return; }
    var hh=String(savedAt.getHours()).padStart(2,"0"),mm=String(savedAt.getMinutes()).padStart(2,"0");
    el.innerHTML='<b>Guardado en este equipo</b> '+hh+":"+mm;
  }

  /* ---------- memoria persistente del navegador (IndexedDB) ----------
     Aquí viven las fotos (recortada y original) y el historial de cambios.
     Si el navegador no lo permite, todo sigue funcionando en memoria. */
  var idb=(function(){
    var dbp=null;
    function open(){
      if(!dbp) dbp=new Promise(function(res,rej){
        try{
          var r=indexedDB.open("starmoda",1);
          r.onupgradeneeded=function(){ var d=r.result; d.createObjectStore("blobs"); d.createObjectStore("kv"); };
          r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
        }catch(e){ rej(e); }
      });
      return dbp;
    }
    function run(store,mode,fn){
      return open().then(function(d){ return new Promise(function(res,rej){
        var t=d.transaction(store,mode),q=fn(t.objectStore(store)),out;
        if(q) q.onsuccess=function(){ out=q.result; };
        t.oncomplete=function(){ res(out); }; t.onerror=t.onabort=function(){ rej(t.error); };
      }); });
    }
    function safe(p,fallback){ return p.catch(function(){ return fallback; }); }
    return {
      get:function(st,k){ return safe(run(st,"readonly",function(s){ return s.get(k); }),undefined); },
      put:function(st,k,v){ return safe(run(st,"readwrite",function(s){ return s.put(v,k); }),undefined); },
      del:function(st,k){ return safe(run(st,"readwrite",function(s){ return s.delete(k); }),undefined); },
      keys:function(st){ return safe(run(st,"readonly",function(s){ return s.getAllKeys(); }),[]); }
    };
  })();
  var blobs={
    put:function(key,p,o){ return idb.put("blobs",key,{p:p,o:o,t:Date.now()}).then(function(){ availKeys[key]=1; }); },
    get:function(key){ return idb.get("blobs",key); }
  };
  var askedPersist=false;
  function askPersist(){
    if(askedPersist) return; askedPersist=true;
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  }
  /* Vuelve a poner la vista previa de las fotos guardadas en el navegador. */
  function hydratePhotos(){
    var keys=[];
    state.products.forEach(function(p){ (p.photos||[]).forEach(function(f){ if(f.key&&!f.url) keys.push(f); }); });
    return idb.keys("blobs").then(function(all){
      (all||[]).forEach(function(k){ availKeys[k]=1; });
      return Promise.all(keys.map(function(f){
        if(upFiles[f.key]){ f.url=URL.createObjectURL(upFiles[f.key]); return; }
        if(!availKeys[f.key]) return;
        return blobs.get(f.key).then(function(r){ if(r&&r.p){ upFiles[f.key]=r.p; if(r.o) origFiles[f.key]=r.o; f.url=URL.createObjectURL(r.p); } });
      }));
    }).then(function(){ if(keys.length){ paintList(); paintForm(); } });
  }
  /* Borra del navegador las fotos que ya nadie usa (ni la captura actual ni
     el historial), para no llenar el disco. */
  function gcBlobs(){
    var used={};
    function mark(list){ (list||[]).forEach(function(p){ (p.photos||[]).forEach(function(f){ if(f.key) used[f.key]=1; }); }); }
    mark(state.products);
    hist.entries.forEach(function(e){ try{ mark(JSON.parse(e.snap).products); }catch(x){} });
    idb.keys("blobs").then(function(all){ (all||[]).forEach(function(k){ if(!used[k]){ idb.del("blobs",k); delete availKeys[k]; } }); });
  }

  /* ---------- historial de cambios (deshacer / rehacer) ----------
     Cada pausa al capturar deja una foto del catálogo completo con una
     descripción. Se puede deshacer, rehacer o volver a cualquier punto. */
  var HIST_MAX=80;
  var hist={entries:[],pos:-1}, histTimer=null, histMute=false, histPending=false, histReady=false;
  var FIELD={title:"nombre",category:"categoría",body:"descripción",price:"precio",compareAt:"precio antes",
    colors:"colores",sizes:"tallas",variants:"inventario y SKU",tags:"etiquetas",material:"material",fit:"fit",
    care:"cuidados",style:"estilo",vendor:"proveedor",modelInfo:"info de la modelo",measurements:"medidas",origin:"origen",photos:"fotos",notes:"notas"};
  function snapshot(){
    var ps=clone(state.products); ps.forEach(function(p){ delete p._t; (p.photos||[]).forEach(function(f){ delete f.url; }); });
    return JSON.stringify({products:ps,vocab:state.vocab,deleted:state.deleted,active:state.active});
  }
  function describe(a,b){
    var A={},B={},out=[];
    function nm(p){ return p.title||"Prenda sin nombre"; }
    a.products.forEach(function(p){ A[p.id]=p; }); b.products.forEach(function(p){ B[p.id]=p; });
    b.products.forEach(function(p){
      if(!A[p.id]){ out.push("Nueva prenda: "+nm(p)); return; }
      var ch=Object.keys(FIELD).filter(function(k){ return stable(A[p.id][k])!==stable(p[k]); }).map(function(k){
        if(k!=="photos") return FIELD[k];
        var na=(A[p.id].photos||[]).length, nb=(p.photos||[]).length;
        return nb>na?"agregó "+(nb-na===1?"una foto":(nb-na)+" fotos"):nb<na?"quitó "+(na-nb===1?"una foto":(na-nb)+" fotos"):"ajuste de fotos";
      });
      if(ch.length) out.push(nm(p)+" · "+ch.slice(0,3).join(", ")+(ch.length>3?"…":""));
    });
    a.products.forEach(function(p){ if(!B[p.id]) out.push("Eliminaste "+nm(p)); });
    if(stable(a.vocab)!==stable(b.vocab)) out.push("Vocabulario");
    if(!out.length) return "";
    return out.length>2?out.slice(0,2).join(" · ")+" y "+(out.length-2)+" más":out.join(" · ");
  }
  function commitHistory(label){
    histTimer=null; histPending=false;
    var snap=snapshot(), last=hist.entries[hist.pos];
    if(last&&last.snap===snap) return;
    var text=label;
    if(!text&&last){ try{ text=describe(JSON.parse(last.snap),JSON.parse(snap)); }catch(e){} }
    if(last&&!text) return;
    hist.entries=hist.entries.slice(0,hist.pos+1);
    hist.entries.push({t:Date.now(),label:text||"Cambio",snap:snap});
    if(hist.entries.length>HIST_MAX) hist.entries=hist.entries.slice(-HIST_MAX);
    hist.pos=hist.entries.length-1;
    saveHistory(); paintUndo();
  }
  function recordHistory(label,now){
    if(histMute||!histReady) return; /* antes de cargar, el punto inicial ya incluye lo capturado */
    clearTimeout(histTimer); histPending=true;
    if(label||now) commitHistory(label); else histTimer=setTimeout(function(){ commitHistory(); },700);
  }
  function flushHistory(){ if(histPending){ clearTimeout(histTimer); commitHistory(); } }
  var histSaveTimer=null;
  function saveHistory(){
    clearTimeout(histSaveTimer);
    histSaveTimer=setTimeout(function(){ idb.put("kv","historial",{entries:hist.entries,pos:hist.pos}); },400);
  }
  function restoreSnap(i,why,label){
    var e=hist.entries[i]; if(!e) return;
    var d=JSON.parse(e.snap);
    state.products=d.products||[]; state.vocab=d.vocab||freshVocab(); state.deleted=d.deleted||{};
    (state.products).forEach(function(p){ (p.photos||[]).forEach(function(f){ f.url=upFiles[f.key]?URL.createObjectURL(upFiles[f.key]):""; if(!f.src&&uploaded[f.key]) f.src=uploaded[f.key]; }); });
    if(!state.products.some(function(p){ return p.id===state.active; })) state.active=d.active&&state.products.some(function(p){ return p.id===d.active; })?d.active:(state.products[0]&&state.products[0].id)||null;
    hist.pos=i;
    histMute=true; save(); histMute=false;
    saveHistory(); paintUndo(); paintAll(); hydratePhotos();
    toast(why+": "+(label||e.label));
  }
  function undo(){ flushHistory(); if(hist.pos>0) restoreSnap(hist.pos-1,"Deshiciste",hist.entries[hist.pos].label); }
  function redo(){ flushHistory(); if(hist.pos<hist.entries.length-1) restoreSnap(hist.pos+1,"Rehiciste"); }
  function paintUndo(){
    var u=document.getElementById("btnUndo"), r=document.getElementById("btnRedo");
    if(u) u.disabled=!(hist.pos>0||histPending);
    if(r) r.disabled=!(hist.pos<hist.entries.length-1);
  }
  function loadHistory(){
    return idb.get("kv","historial").then(function(h){
      if(h&&Array.isArray(h.entries)){ hist.entries=h.entries; hist.pos=Math.min(h.pos,h.entries.length-1); }
      var snap=snapshot(), at=hist.entries[hist.pos];
      if(!at||at.snap!==snap){
        hist.entries=hist.entries.slice(0,hist.pos+1);
        hist.entries.push({t:Date.now(),label:hist.entries.length?"Estado al abrir la app":"Inicio",snap:snap});
        hist.pos=hist.entries.length-1; saveHistory();
      }
      histReady=true; paintUndo();
    },function(){ histReady=true; });
  }
  function historyModal(){
    flushHistory();
    var list=h("ul",{class:"hist"});
    var veil;
    function when(t){ var d=new Date(t), today=new Date(); return (d.toDateString()===today.toDateString()?"Hoy":d.toLocaleDateString("es-MX",{day:"numeric",month:"short"}))+" · "+hhmm(d); }
    for(var i=hist.entries.length-1;i>=0;i--) (function(i){
      var e=hist.entries[i], cls=i===hist.pos?"on":i>hist.pos?"future":"";
      list.appendChild(h("li",{class:cls},[
        h("div",{},[h("b",{text:e.label}),h("small",{text:when(e.t)+(i===hist.pos?" · Estás aquí":i>hist.pos?" · Deshecho":"")})]),
        i===hist.pos?h("span",{class:"chip ok",text:"Actual"}):h("button",{text:"Volver aquí",onclick:function(){ veil.remove(); restoreSnap(i,"Volviste al punto"); }})
      ]));
    })(i);
    veil=modal("Historial de cambios",[
      h("p",{class:"hint",style:"margin:0 0 14px",text:"Cada cambio queda guardado en este navegador. Puedes volver a cualquier punto y luego rehacer si te arrepientes. Para que otros lo vean, toca Guardar en la nube."}),
      list
    ],[]);
  }

  /* ---------- sincronización opcional ---------- */
  function remoteOn(){ return !!(REMOTE.url&&REMOTE.key); }
  function rHeaders(extra){
    var h={apikey:REMOTE.key,Authorization:"Bearer "+REMOTE.key,"Content-Type":"application/json"};
    if(extra) Object.keys(extra).forEach(function(k){ h[k]=extra[k]; });
    return h;
  }
  function setSync(cls,txt){
    var el=document.getElementById("sync");
    if(!el) return;
    el.className="sync "+cls;
    el.innerHTML=txt?('<b>&bull;</b> '+txt):"";
  }
  /* Código de acceso: se pide una vez y se recuerda en este navegador.
     Nunca va en el código de la página. */
  var CODEKEY="starmoda-codigo";
  function getCode(){ try{ return localStorage.getItem(CODEKEY)||""; }catch(e){ return ""; } }
  function setCode(c){ try{ if(c) localStorage.setItem(CODEKEY,c); else localStorage.removeItem(CODEKEY); }catch(e){} }

  function rpc(fn,args){
    return fetch(REMOTE.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{
      method:"POST",headers:rHeaders(),body:JSON.stringify(args)
    }).then(function(r){
      return r.text().then(function(t){
        var body=null; try{ body=t?JSON.parse(t):null; }catch(e){}
        if(!r.ok){
          var msg=(body&&(body.message||body.hint))||("HTTP "+r.status);
          var err=new Error(msg); err.badCode=/codigo_invalido/.test(msg); throw err;
        }
        return body;
      });
    });
  }

  /* Junta lo que hay en el servidor con lo de este navegador, prenda por
     prenda: gana el cambio más reciente, y un borrado gana a una versión
     más vieja. Así dos personas pueden capturar sin pisarse. */
  function mergeIn(r){
    var changed=false, activeHit=false, byId={};
    var rdel=(r&&r.deleted)||{};
    Object.keys(rdel).forEach(function(id){
      if(!state.deleted[id]||state.deleted[id]<rdel[id]){ state.deleted[id]=rdel[id]; }
    });
    state.products.forEach(function(p){ byId[p.id]=p; });
    ((r&&r.products)||[]).forEach(function(rp){
      if(!rp||!rp.id||rp.demo) return;
      var loc=byId[rp.id], rt=+rp._t||0, del=state.deleted[rp.id]||0;
      if(!loc){
        if(del&&del>=rt) return;
        var np=clone(rp); (np.photos||[]).forEach(function(f){ f.url=""; });
        state.products.push(np); localSig[np.id]=sig(np); byId[np.id]=np; changed=true;
        return;
      }
      if(rt>(+loc._t||0)){
        var urls={};
        (loc.photos||[]).forEach(function(f){ if(f.url) urls[f.name]=f.url; });
        Object.keys(loc).forEach(function(k){ delete loc[k]; });
        var fresh=clone(rp);
        Object.keys(fresh).forEach(function(k){ loc[k]=fresh[k]; });
        (loc.photos||[]).forEach(function(f){ f.url=urls[f.name]||""; });
        localSig[loc.id]=sig(loc); changed=true;
        if(loc.id===state.active) activeHit=true;
      }
    });
    state.products=state.products.filter(function(p){
      var d=state.deleted[p.id];
      if(d&&!p.demo&&(+p._t||0)<=d){
        delete localSig[p.id]; changed=true;
        if(p.id===state.active) activeHit=true;
        return false;
      }
      return true;
    });
    if(r&&r.vocab&&r.vocab.colors&&(+r.vocabT||0)>(+state.vocabT||0)){
      state.vocab=clone(r.vocab); state.vocabT=+r.vocabT;
      localVocabSig=stable(state.vocab); changed=true; activeHit=true;
    }
    if(state.products.some(function(p){ return !p.demo; })){
      var n=state.products.length;
      state.products=state.products.filter(function(p){
        if(p.demo&&p.id===state.active) activeHit=true;
        return !p.demo;
      });
      if(state.products.length!==n) changed=true;
    }
    if(!state.products.some(function(p){ return p.id===state.active; })){
      state.active=state.products.length?state.products[0].id:null; activeHit=true;
    }
    if(changed){ persist(); if(activeHit) paintAll(); else paintList(); }
    return changed;
  }
  function core(d){
    var c={vocab:d.vocab||null,vocabT:+d.vocabT||0,deleted:d.deleted||{},
      products:(d.products||[]).filter(function(p){ return p&&!p.demo; }).map(function(p){
        var x=clone(p); (x.photos||[]).forEach(function(f){ delete f.url; }); return x; })};
    return stable(c);
  }

  /* ---------- nube: qué falta por subir ----------
     Se recuerda la firma de lo último que quedó igual en la nube. Lo que
     difiere son "cambios sin subir"; las fotos sin URL, "fotos por subir". */
  var SYNCKEY="starmoda-nube";
  var synced=(function(){ try{ return JSON.parse(localStorage.getItem(SYNCKEY))||null; }catch(e){ return null; } })()||{sigs:{},vocab:"",del:{},at:0};
  function markSynced(d){
    synced={sigs:{},vocab:stable((d&&d.vocab)||null),del:clone((d&&d.deleted)||{}),at:Date.now()};
    ((d&&d.products)||[]).forEach(function(p){ if(p&&p.id&&!p.demo) synced.sigs[p.id]=sig(p); });
    try{ localStorage.setItem(SYNCKEY,JSON.stringify(synced)); }catch(e){}
  }
  function pendingInfo(){
    var changes=0, photos=0;
    state.products.forEach(function(p){
      if(p.demo) return;
      if(synced.sigs[p.id]!==sig(p)) changes++;
      (p.photos||[]).forEach(function(f){ if(f.level!=="bad"&&!f.src) photos++; });
    });
    Object.keys(state.deleted).forEach(function(id){ if(!synced.del[id]&&synced.sigs[id]) changes++; });
    if(state.vocab&&stable(state.vocab)!==synced.vocab&&synced.at) changes++;
    return {changes:changes,photos:photos,total:changes+photos};
  }
  function paintCloud(){
    var btn=document.getElementById("btnSave"), badge=document.getElementById("saveBadge");
    if(!btn) return;
    if(!remoteOn()){ btn.style.display="none"; return; }
    var pi=pendingInfo();
    badge.textContent=pi.total?String(pi.total):"";
    btn.classList.toggle("dirty",!!pi.total);
    btn.title=pi.total?((pi.changes?pi.changes+" cambio(s) sin subir":"")+(pi.changes&&pi.photos?" y ":"")+(pi.photos?pi.photos+" foto(s) por subir":"")):"Todo está en la nube. Toca para traer lo más reciente.";
    if(syncing) return;
    if(!getCode()) setSync("down","Falta código — toca aquí");
    else if(pi.total) setSync("local",pi.total+(pi.total===1?" cambio sin subir":" cambios sin subir"));
    else if(synced.at) setSync("up","En la nube · "+hhmm(new Date(synced.at)));
  }

  var syncing=false, askedCode=false;
  /* Trae lo de la nube y lo junta; con push:true también sube lo de aquí. */
  function remoteSync(opts){
    opts=opts||{};
    if(!remoteOn()) return Promise.resolve(false);
    var code=getCode();
    if(!code){ setSync("down","Falta código — toca aquí"); if(!askedCode){ askedCode=true; codeModal(); } return Promise.resolve(false); }
    if(syncing) return Promise.resolve(false);
    syncing=true;
    setSync("local",opts.push?"Guardando en la nube…":"Trayendo cambios…");
    var hadLocal=pendingInfo().changes>0;
    return rpc("starmoda_get",{p_code:code,p_doc:REMOTE.docId}).then(function(rows){
      var row=Array.isArray(rows)?rows[0]:rows;
      var remote=(row&&row.payload)||{};
      if(mergeIn(remote)) recordHistory("Cambios traídos de la nube");
      if(!opts.push){
        if(!hadLocal) markSynced(payload()); else markSynced(remote);
        return null;
      }
      var mine=payload();
      if(core(mine)===core(remote)){ markSynced(mine); return null; }
      return rpc("starmoda_save",{p_code:code,p_payload:mine,p_doc:REMOTE.docId}).then(function(){ markSynced(mine); });
    }).then(function(){
      syncing=false; paintCloud(); paintList(); paintPanel();
      return true;
    },function(e){
      syncing=false;
      if(e&&e.badCode){
        setCode(""); setSync("down","Código no válido — toca aquí");
        codeModal("Ese código no es válido. Revísalo con Nexium.");
      } else {
        setSync("down","Sin conexión — todo sigue guardado aquí");
      }
      throw e;
    });
  }
  function remotePull(){ return remoteSync().catch(function(){}); }

  /* Botón "Guardar en la nube": primero sube las fotos pendientes (ya con su
     recorte final), luego junta y sube los datos. */
  function cloudSave(){
    if(!remoteOn()||syncing) return;
    if(!getCode()){ codeModal(); return; }
    var btn=document.getElementById("btnSave");
    btn.disabled=true;
    uploadPending(function(done,total){ setSync("local","Subiendo fotos "+done+"/"+total+"…"); }).then(function(r){
      return remoteSync({push:true}).then(function(){
        if(r.failed) toast(r.failed+(r.failed===1?" foto no se pudo subir; se reintenta al volver a guardar":" fotos no se pudieron subir; se reintentan al volver a guardar"),true);
        else toast(r.done?("Guardado en la nube · "+r.done+(r.done===1?" foto subida":" fotos subidas")):"Guardado en la nube");
      });
    }).catch(function(e){
      if(!(e&&e.badCode)) toast("No se pudo guardar en la nube. Todo sigue guardado aquí.",true);
    }).then(function(){ btn.disabled=false; paintCloud(); paintAll(); });
  }

  /* ---------- subida de fotos ----------
     /api/starmoda/upload valida el código y regresa una URL firmada; la foto
     se sube directo a Supabase Storage y su URL pública (f.src) se guarda en
     la prenda, así viaja con la sincronización y llega al CSV de Shopify.
     El archivo original solo vive en memoria: si se recarga la página antes
     de subirlo, hay que volver a elegir la foto. */
  var upFiles={}, upState={}, origFiles={}, busyKeys={}, availKeys={};
  /* URL ya subida por cada foto: si un "deshacer" le quita la URL, no se
     vuelve a subir el mismo archivo. */
  var UPKEY="starmoda-subidas";
  var uploaded=(function(){ try{ return JSON.parse(localStorage.getItem(UPKEY))||{}; }catch(e){ return {}; } })();
  function rememberUpload(key,src){ uploaded[key]=src; try{ localStorage.setItem(UPKEY,JSON.stringify(uploaded)); }catch(e){} }

  function upInfo(f){
    if(f.level==="bad") return null;
    if(f.src) return {cls:"ok",text:"En la nube"};
    if(!remoteOn()) return null;
    var s=upState[f.key];
    if(s==="subiendo") return {cls:"",text:"Subiendo…"};
    var has=!!(f.key&&(upFiles[f.key]||availKeys[f.key]));
    if(!has) return {cls:"err",text:"Se perdió el archivo en este navegador: quítala y vuelve a elegirla"};
    if(s) return {cls:"err",text:s+" — se reintenta al guardar en la nube"};
    return {cls:"",text:"Por subir · se sube al guardar en la nube"};
  }
  function photoBlob(key){
    if(upFiles[key]) return Promise.resolve(upFiles[key]);
    return blobs.get(key).then(function(r){ if(r&&r.p){ upFiles[key]=r.p; if(r.o) origFiles[key]=r.o; return r.p; } return null; });
  }
  function photoOrig(key){
    if(origFiles[key]) return Promise.resolve(origFiles[key]);
    return blobs.get(key).then(function(r){ if(r&&r.o){ origFiles[key]=r.o; return r.o; } return null; });
  }
  function uploadOne(p,f,code){
    if(uploaded[f.key]){ f.src=uploaded[f.key]; return Promise.resolve(true); }
    return photoBlob(f.key).then(function(file){
      if(!file) throw new Error("Falta el archivo");
      upState[f.key]="subiendo"; paintPhotosIfOpen(p);
      var name=(f.target||"foto").replace(/\.[a-z]+$/,"")+"-"+f.key+".jpg";
      return fetch("/api/starmoda/upload",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:code,productId:p.id,fileName:name})
      }).then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(t){
          if(!r.ok){
            var e=new Error(t.error==="codigo_invalido"?"Código no válido":"No se pudo subir ("+(t.error||r.status)+")");
            e.badCode=t.error==="codigo_invalido"; throw e;
          }
          return t;
        });
      }).then(function(t){
        var fd=new FormData();
        fd.append("cacheControl","31536000");
        fd.append("",file,name);
        return fetch(t.uploadUrl,{method:"PUT",headers:{apikey:REMOTE.key,Authorization:"Bearer "+REMOTE.key,"x-upsert":"true"},body:fd}).then(function(r){
          if(!r.ok) throw new Error("No se pudo subir ("+r.status+")");
          return t.publicUrl;
        });
      }).then(function(src){
        delete upState[f.key]; rememberUpload(f.key,src); f.src=src; paintPhotosIfOpen(p);
        return true;
      });
    });
  }
  /* Sube todas las fotos pendientes, de una en una. */
  function uploadPending(progress){
    var code=getCode(), jobs=[];
    state.products.forEach(function(p){
      if(p.demo) return;
      (p.photos||[]).forEach(function(f){ if(f.level!=="bad"&&!f.src&&f.key) jobs.push([p,f]); });
    });
    var done=0, failed=0, i=0;
    if(!jobs.length) return Promise.resolve({done:0,failed:0});
    function next(){
      if(i>=jobs.length) return Promise.resolve();
      var j=jobs[i++]; progress&&progress(done+failed+1,jobs.length);
      return uploadOne(j[0],j[1],code).then(function(){ done++; },function(e){
        failed++; upState[j[1].key]=(e&&e.message)||"No se pudo subir";
        if(e&&e.badCode){ i=jobs.length; throw e; }
      }).then(next);
    }
    return next().then(function(){
      if(done){ persist(); recordHistory("Fotos subidas a la nube",true); }
      return {done:done,failed:failed};
    });
  }
  var photoRepaint=null;
  function paintPhotosIfOpen(p){ if(photoRepaint&&cur()===p) photoRepaint(); }

  /* ---------- fotos: recorte y compresión en el navegador ---------- */
  function loadImage(file){
    return new Promise(function(res){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){ URL.revokeObjectURL(url); res(img); };
      img.onerror=function(){ URL.revokeObjectURL(url); res(null); };
      img.src=url;
    });
  }
  /* Recorta a 3:4 (pos: start/center/end sobre el eje que sobra), reduce a
     2400 px de alto como máximo y guarda en JPG bajando la calidad hasta
     quedar en menos de 2 MB. El fondo blanco cubre la transparencia de PNG. */
  function processImage(img,pos){
    var W=img.naturalWidth,H=img.naturalHeight,t=PHOTO.ratio;
    var x=0,y=0,cw=W,ch=H,axis="";
    if(Math.abs(W/H-t)>0.005){
      if(W/H>t){ cw=Math.round(H*t); axis="x"; x=pos==="start"?0:pos==="end"?W-cw:Math.round((W-cw)/2); }
      else { ch=Math.round(W/t); axis="y"; y=pos==="start"?0:pos==="end"?H-ch:Math.round((H-ch)/2); }
    }
    var sc=Math.min(1,PHOTO.maxH/ch), ow=Math.round(cw*sc), oh=Math.round(ch*sc);
    var c=document.createElement("canvas"); c.width=ow; c.height=oh;
    var g=c.getContext("2d");
    g.fillStyle="#fff"; g.fillRect(0,0,ow,oh);
    g.imageSmoothingQuality="high";
    g.drawImage(img,x,y,cw,ch,0,0,ow,oh);
    var qs=[0.88,0.8,0.72,0.62,0.5];
    function attempt(i){
      return new Promise(function(res){ c.toBlob(res,"image/jpeg",qs[i]); }).then(function(b){
        return (b&&b.size>PHOTO.maxBytes&&i<qs.length-1)?attempt(i+1):b;
      });
    }
    return attempt(0).then(function(b){ return {blob:b,w:ow,h:oh,axis:axis,scaled:sc<1}; });
  }

  /* ---------- conexión ----------
     Revisa cada pieza por separado para decir exactamente qué falla:
     la base (y el SQL), el código, el servidor de fotos en Vercel y el
     bucket de Supabase. */
  var photoStatus=null, visionOn=false; /* null: sin revisar · {ok:true} · {ok:false,msg} */
  function dbCheck(code){
    if(!remoteOn()) return Promise.resolve({s:"off"});
    return fetch(REMOTE.url.replace(/\/$/,"")+"/rest/v1/rpc/starmoda_get",{
      method:"POST",headers:rHeaders(),body:JSON.stringify({p_code:code||"",p_doc:REMOTE.docId})
    }).then(function(r){
      return r.text().then(function(t){
        if(r.ok) return {s:"ok"};
        if(/codigo_invalido/.test(t)) return {s:"bad_code"};
        if(r.status===404||/PGRST202|Could not find the function/i.test(t)) return {s:"no_sql"};
        if(r.status===401||r.status===403) return {s:"bad_key",msg:t.slice(0,160)};
        return {s:"err",msg:"HTTP "+r.status+" "+t.slice(0,160)};
      });
    },function(){ return {s:"offline"}; });
  }
  function photoCheck(code){
    return fetch("/api/starmoda/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code||""})})
      .then(function(r){ return r.ok?r.json():{missing:true,status:r.status}; },function(){ return {missing:true}; });
  }
  function photoVerdict(ph){
    if(!ph||ph.missing) return {ok:false,msg:"No se encontró el servidor de fotos de nexiummx.com. Abre la app desde nexiummx.com/starmoda."};
    if(!ph.config) return {ok:false,msg:"Faltan SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY en Vercel (y volver a desplegar)."};
    var proj=REMOTE.url.replace(/^https:\/\//,"").replace(/\.supabase\.co\/?$/,"");
    if(ph.project&&ph.project!==proj) return {ok:false,msg:"SUPABASE_URL en Vercel apunta a otro proyecto ("+ph.project+"); debe ser https://"+proj+".supabase.co. Corrígelo y vuelve a desplegar."};
    if(ph.keyKind==="publishable"||ph.keyKind==="anon") return {ok:false,msg:"En SUPABASE_SERVICE_ROLE_KEY de Vercel está la llave pública ("+(ph.keyKind==="anon"?"anon":"sb_publishable_…")+"). Debe ser la Secret key (sb_secret_…) de Supabase › Project Settings › API Keys. Cámbiala y vuelve a desplegar."};
    var det=ph.detail||"";
    if(/permission denied for function/i.test(det)) return {ok:false,msg:"La llave es correcta, pero falta un permiso en la base: corre el SQL completo otra vez en Supabase (incluye «grant execute … to service_role»)."};
    if(/Could not find the function|PGRST202/i.test(det)) return {ok:false,msg:"La llave es correcta, pero faltan las funciones de Star Moda: corre el SQL en Supabase."};
    if(ph.error&&/401|403/.test(ph.error)) return {ok:false,msg:(ph.keyKind==="desconocida"
      ?"Lo que hay en SUPABASE_SERVICE_ROLE_KEY de Vercel no parece una llave de Supabase (debe empezar con sb_secret_). "
      :"Supabase no reconoce la llave secreta de Vercel: puede ser de otro proyecto, estar borrada o mal copiada. Copia de nuevo la Secret key. ")
      +(det?"Supabase respondió: «"+det+"».":"")};
    if(ph.bucket===false) return {ok:false,msg:"No existe el espacio de fotos starmoda-fotos (o no es público): corre el SQL completo en Supabase."};
    if(ph.bucket===null) return {ok:false,msg:"No se pudo revisar el espacio de fotos ("+(ph.error||"error")+(ph.detail?": "+ph.detail:"")+")."};
    return {ok:true};
  }
  function refreshPhotoStatus(){
    if(!remoteOn()||!getCode()) return;
    photoCheck(getCode()).then(function(ph){
      if(ph&&!ph.missing) visionOn=!!ph.vision;
      var v=photoVerdict(ph), changed=!photoStatus||photoStatus.ok!==v.ok;
      photoStatus=v; if(changed) paintForm();
    });
  }
  function photoWarnNode(){
    if(!remoteOn()||!photoStatus||photoStatus.ok) return null;
    return h("div",{class:"banner err"},[
      h("div",{},[h("b",{text:"La subida de fotos no está lista"}),h("span",{text:photoStatus.msg})]),
      h("button",{text:"Ver conexión",onclick:function(){ connModal(); }})
    ]);
  }

  function connModal(opts){
    opts=opts||{};
    var list=h("ul",{class:"checks"});
    var input=h("input",{type:"text",autocomplete:"off",placeholder:"sm-xxxx-xxxx-xxxx-xxxx",style:"font-family:var(--mono)"});
    input.value=getCode();
    var err=h("div",{class:"codeerr"});
    var btn=h("button",{class:"primary",text:getCode()?"Guardar y probar":"Entrar"});
    function row(cls,title,detail){
      return h("li",{class:cls},[h("span",{class:"ic",text:cls==="ok"?"✓":cls==="bad"?"✕":"…"}),
        h("div",{},[h("span",{text:title}),detail?h("small",{text:detail}):null])]);
    }
    function paint(rows){ list.innerHTML=""; rows.forEach(function(r){ list.appendChild(row.apply(null,r)); }); }
    function run(code){
      if(!remoteOn()){ paint([["bad","La app no tiene configurada la conexión","Falta la URL o la llave pública de Supabase en REMOTE (avísale a Nexium)."]]); return Promise.resolve(null); }
      paint([["wait","Base de datos","Revisando…"],["wait","Código de acceso","Revisando…"],["wait","Subida de fotos","Revisando…"]]);
      return Promise.all([dbCheck(code),photoCheck(code)]).then(function(res){
        var db=res[0],ph=res[1],rows=[];
        if(db.s==="ok"||db.s==="bad_code") rows.push(["ok","Base de datos","Conectada a Supabase."]);
        else if(db.s==="no_sql") rows.push(["bad","Base de datos","Supabase responde, pero faltan las tablas de Star Moda: corre el SQL en Supabase › SQL Editor."]);
        else if(db.s==="bad_key") rows.push(["bad","Base de datos","Supabase rechazó la llave pública de la app."]);
        else if(db.s==="offline") rows.push(["bad","Base de datos","Sin conexión con Supabase. Revisa el internet; si sigue, el proyecto puede estar pausado."]);
        else rows.push(["bad","Base de datos",db.msg||"Error desconocido"]);
        if(!code) rows.push(["bad","Código de acceso","Escribe el código que te dio Nexium."]);
        else if(db.s==="ok") rows.push(["ok","Código de acceso","Válido."]);
        else if(db.s==="bad_code") rows.push(["bad","Código de acceso","Ese código no existe o fue desactivado."]);
        else rows.push(["wait","Código de acceso","No se pudo revisar hasta que la base responda."]);
        var v=photoVerdict(ph);
        rows.push(v.ok?["ok","Subida de fotos","Servidor y espacio de fotos listos."]:["bad","Subida de fotos",v.msg]);
        if(ph&&!ph.missing){ visionOn=!!ph.vision;
          rows.push(ph.vision?["ok","Lectura de etiquetas con IA","Lista: en Recibir mercancía puedes leer la etiqueta con una foto."]:["wait","Lectura de etiquetas con IA (opcional)","Para leer estilo, color y talla con la cámara, agrega ANTHROPIC_API_KEY en Vercel y vuelve a desplegar. El escáner funciona sin esto."]); }
        paint(rows);
        if(code&&db.s==="ok"){ photoStatus=v; }
        return db;
      });
    }
    function submit(){
      var c=input.value.trim();
      if(!c){ err.textContent="Escribe el código."; input.focus(); return; }
      err.textContent=""; btn.disabled=true;
      run(c).then(function(db){
        btn.disabled=false;
        if(db&&db.s==="bad_code"){ err.textContent="Ese código no es válido. Revísalo con Nexium."; input.select(); return; }
        if(db&&db.s!=="ok"){ err.textContent="No se pudo comprobar el código: revisa la base de datos arriba."; return; }
        setCode(c); err.textContent=""; toast("Código válido: sincronizando");
        btn.textContent="Guardar y probar";
        remoteSync().catch(function(){}); paintForm();
        if(opts.ask) veil.remove();
      });
    }
    btn.addEventListener("click",submit);
    input.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
    var veil=modal(opts.ask?"Bienvenida":"Conexión",[
      opts.ask?h("p",{class:"hint",style:"margin:0 0 14px",text:opts.msg||"Escribe el código de acceso que te dio Nexium. Con él, lo que captures se guarda en la nube y lo ven todos. Se pide una sola vez en este navegador."}):null,
      h("span",{class:"kicker",text:"Código de acceso"}),
      h("div",{style:"display:flex;gap:8px;margin-top:6px"},[input,btn]),
      err,
      h("div",{style:"height:14px"}),
      h("span",{class:"kicker",text:"Estado"}),
      h("div",{style:"height:6px"}),
      list,
      h("p",{class:"hint",style:"margin:0",text:"Sin código, lo que captures se queda solo en este navegador. Puedes volver aquí desde el botón Conexión."})
    ],[h("button",{text:"Probar de nuevo",onclick:function(){ run(input.value.trim()||getCode()); }})]);
    run(getCode());
    setTimeout(function(){ if(!getCode()||opts.ask) input.focus(); },50);
  }
  function codeModal(msg){ connModal({ask:true,msg:msg}); }

  /* ---------- guardado en la nube (base de datos del artefacto) ----------
     Cada prenda es un documento en "prendas/<id>" y el vocabulario vive en
     "config/vocab". Este navegador sigue guardando su copia local; la nube
     es lo que comparten todos los que abren la app. Gana el cambio más
     reciente de cada prenda. Lo que solo existe en un navegador se sube
     solo la primera vez que abre esta versión. */
  var cloud={db:null,write:true,ready:false,gotP:false,gotV:false,
    sent:{},vocabSent:null,timer:null,busy:false,again:false};

  function hhmm(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function cloudQueue(){
    if(!cloud.db||!cloud.write||!cloud.ready) return;
    clearTimeout(cloud.timer);
    cloud.timer=setTimeout(cloudFlush,1200);
  }
  function cloudReadOnly(){
    cloud.write=false;
    setSync("local","Solo en este navegador — pide acceso de edición");
  }
  function cloudFlush(){
    if(!cloud.db||!cloud.write||!cloud.ready) return;
    if(cloud.busy){ cloud.again=true; return; }
    var jobs=[];
    state.products.forEach(function(p,i){
      if(p.demo) return;
      var s=sig(p);
      if(cloud.sent[p.id]!==s) jobs.push({path:"prendas/"+p.id,id:p.id,s:s,
        body:{p:strip(p),t:p._t||1,o:i,deleted:false}});
    });
    Object.keys(state.deleted).forEach(function(id){
      if(cloud.sent[id]!=="__del") jobs.push({path:"prendas/"+id,id:id,s:"__del",
        body:{deleted:true,t:state.deleted[id]}});
    });
    var vs=stable(state.vocab);
    if(cloud.vocabSent!==vs) jobs.push({path:"config/vocab",vocab:true,s:vs,
      body:{v:clone(state.vocab),t:state.vocabT||1}});
    if(!jobs.length){ setSync("up","En la nube "+hhmm(new Date())); return; }
    cloud.busy=true;
    setSync("local","Guardando en la nube…");
    var chain=Promise.resolve();
    jobs.forEach(function(j){
      chain=chain.then(function(){
        return cloud.db.doc(j.path).set(j.body).then(function(){
          if(j.vocab) cloud.vocabSent=j.s; else cloud.sent[j.id]=j.s;
        });
      });
    });
    chain.then(function(){
      cloud.busy=false;
      setSync("up","En la nube "+hhmm(new Date()));
      if(cloud.again){ cloud.again=false; cloudFlush(); }
    },function(e){
      cloud.busy=false; cloud.again=false;
      var code=e&&e.code;
      if(code==="invalid_argument"||code==="not_granted"||code==="revoked") cloudReadOnly();
      else if(code==="quota_exceeded") setSync("down","Nube llena — guardado solo aquí");
      else { setSync("down","Sin conexión — guardado aquí"); setTimeout(cloudQueue,8000); }
    });
  }

  function cloudProducts(snap){
    var byId={}, activeHit=false, changed=false, incoming=[];
    state.products.forEach(function(p){ byId[p.id]=p; });
    snap.docs.forEach(function(d){
      var r=d.data()||{}, id=d.id, loc=byId[id], rt=+r.t||0;
      if(r.deleted){
        if(loc && !loc.demo){
          if((loc._t||0)<=rt){
            state.products=state.products.filter(function(x){ return x.id!==id; });
            delete localSig[id]; state.deleted[id]=rt; cloud.sent[id]="__del";
            if(id===state.active) activeHit=true;
            changed=true;
          }
          /* si aquí es más reciente, se vuelve a subir */
        } else {
          cloud.sent[id]="__del";
          if(!state.deleted[id]||state.deleted[id]<rt) state.deleted[id]=rt;
        }
        return;
      }
      if(!r.p) return;
      var rs=stable(r.p);
      if(!loc){
        if(state.deleted[id] && state.deleted[id]>=rt) return; /* lo borraron aquí después */
        delete state.deleted[id];
        var np=clone(r.p); np._t=rt;
        (np.photos||[]).forEach(function(f){ f.url=""; });
        incoming.push({p:np,o:+r.o||0});
        cloud.sent[id]=rs; localSig[id]=rs; changed=true;
        return;
      }
      if(rt>(loc._t||0)){
        var urls={};
        (loc.photos||[]).forEach(function(f){ if(f.url) urls[f.name]=f.url; });
        Object.keys(loc).forEach(function(k){ delete loc[k]; });
        var fresh=clone(r.p);
        Object.keys(fresh).forEach(function(k){ loc[k]=fresh[k]; });
        loc._t=rt;
        (loc.photos||[]).forEach(function(f){ f.url=urls[f.name]||""; });
        cloud.sent[id]=rs; localSig[id]=rs;
        if(id===state.active) activeHit=true;
        changed=true;
      } else {
        cloud.sent[id]=rs; /* lo que hay en la nube; si difiere, se sube lo de aquí */
      }
    });
    if(incoming.length){
      incoming.sort(function(a,b){ return a.o-b.o; });
      incoming.forEach(function(x){ state.products.push(x.p); });
    }
    /* la prenda de ejemplo sobra en cuanto hay prendas reales */
    if(state.products.some(function(p){ return !p.demo; })){
      var before=state.products.length;
      state.products=state.products.filter(function(p){
        if(p.demo&&p.id===state.active) activeHit=true;
        return !p.demo;
      });
      if(state.products.length!==before) changed=true;
    }
    if(!state.products.some(function(p){ return p.id===state.active; })){
      state.active=state.products.length?state.products[0].id:null;
      activeHit=true;
    }
    if(changed){
      persist();
      if(activeHit) paintAll(); else paintList();
    }
  }

  function cloudVocab(snap){
    if(!snap.exists){ cloud.vocabSent=null; return; }
    var r=snap.data()||{};
    if(!r.v||!r.v.colors) return;
    var rs=stable(r.v), rt=+r.t||0;
    if(rt>(state.vocabT||0)){
      state.vocab=clone(r.v); state.vocabT=rt;
      localVocabSig=rs; cloud.vocabSent=rs;
      persist(); paintAll();
    } else {
      cloud.vocabSent=rs;
    }
  }

  function cloudMaybeReady(){
    if(cloud.ready||!cloud.gotP||!cloud.gotV) return;
    cloud.ready=true;
    if(cloud.write) cloudFlush();
    else cloudReadOnly();
  }

  function cloudInit(){
    if(!(window.claude&&typeof window.claude.use==="function")){
      setSync("local","Solo en este navegador");
      return;
    }
    setSync("local","Conectando con la nube…");
    var dbP=window.claude.use("db"), userP=window.claude.use("user");
    Promise.all([dbP,userP]).then(function(res){
      var db=res[0], user=res[1];
      if(!db){ setSync("local","Solo en este navegador"); return; }
      cloud.db=db;

  /* ---------- auditoría ---------- */
  function audit(p){
    var req=[],rec=[],opt=[],pend=[];
    if(!p.title.trim()) req.push("Nombre de la prenda");
    if(!p.price||Number(p.price)<=0) req.push("Precio");
    if(!p.colors.length) req.push("Al menos un color");
    if(!p.sizes.length) req.push("Al menos una talla");
    var vl=variantList(p);
    var sinQty=vl.filter(function(x){ return x.v.qty===""||x.v.qty===null; });
    if(vl.length&&sinQty.length) req.push(sinQty.length+" variante"+(sinQty.length>1?"s":"")+" sin inventario");
    var skus=vl.map(function(x){ return x.v.sku.trim(); }).filter(Boolean);
    var dup=skus.filter(function(s,i){ return skus.indexOf(s)!==i; });
    if(dup.length) req.push("SKU repetido: "+dup[0]);
    if(vl.length&&skus.length<vl.length) req.push("Hay variantes sin SKU");
    var bcs=vl.map(function(x){ return (x.v.barcode||"").trim(); }).filter(Boolean);
    var badBc=bcs.filter(function(b){ return !barcodeOk(b); });
    if(badBc.length) req.push("Código de barras con dígito verificador incorrecto: "+badBc[0]);
    var idx=barcodeIndex(), dupBc=bcs.filter(function(b){ var hit=idx[b]; return hit&&hit.length>1; });
    if(dupBc.length) req.push("Código de barras repetido: "+dupBc[0]);
    var okp=p.photos.filter(function(f){ return f.level!=="bad"; });
    var porSubir=okp.filter(function(f){ return !f.src; }).length;
    if(!okp.length) req.push("Foto principal");
    else if(okp.length<2) rec.push("Foto secundaria (se ve al pasar el mouse)");
    if(p.photos.some(function(f){ return f.level==="bad"; })) req.push("Hay fotos que no sirven: quítalas y vuelve a subirlas");
    if(p.colors.length>1){
      var cov={}; p.photos.forEach(function(f){ if(f.color) cov[f.color]=1; });
      var falta=p.colors.filter(function(c){ return !cov[c]; });
      if(falta.length&&okp.length) rec.push("Foto propia para: "+falta.join(", "));
    }
    if(!p.category) rec.push("Categoría");
    if(!p.body.trim()) rec.push("Descripción");
    if(!p.tags.length) rec.push("Al menos una etiqueta");
    if(!p.material.trim()) rec.push("Material");
    if(!p.fit) rec.push("Fit");
    if(!p.care.trim()) rec.push("Instrucciones de cuidado");
    if(!p.modelInfo.trim()) opt.push("Info de la modelo");
    if(!p.measurements.trim()) opt.push("Medidas por talla");
    if(!p.origin.trim()) opt.push("Origen");
    if(!p.compareAt) opt.push("Precio antes (solo si hay descuento)");

    var nc=p.colors.filter(isNewColor);
    if(nc.length) pend.push("Color sin programar en el tema: "+nc.join(", "));
    if(p.category&&isNewCat(p.category)) pend.push("Categoría nueva: "+p.category);
    if(remoteOn()&&porSubir) pend.push(porSubir+(porSubir===1?" foto por subir":" fotos por subir")+": se suben al guardar en la nube");
    var nt=p.tags.filter(isNewTag);
    if(nt.length) pend.push("Etiqueta nueva: "+nt.join(", "));
    return {req:req,rec:rec,opt:opt,pend:pend};
  }
  function grade(p){
    var a=audit(p);

  function collectionsOf(p){

    /* keepKey: al mover el encuadre de una foto que aún no se sube, se

    function inspect(file,pos,keepKey){
      var ext=(file.name.split(".").pop()||"").toLowerCase();
      var key=keepKey||Math.random().toString(36).slice(2,8);
      origFiles[key]=file;
      return loadImage(file).then(function(img){
        if(!img) return {name:file.name,ext:ext,w:0,h:0,bytes:file.size,url:"",level:"bad",notes:[],crop:null,
          issues:["No se pudo leer la imagen"+(ext==="heic"||ext==="heif"?" — HEIC no sirve, cambia la cámara a 'Más compatible' o mándala por WhatsApp":"")],
          color:"",target:"",key:key,src:""};
        var W=img.naturalWidth,H=img.naturalHeight;
        var keep=(ext==="jpg"||ext==="jpeg")&&Math.abs(W/H-PHOTO.ratio)<=0.005&&H<=PHOTO.maxH&&file.size<=PHOTO.warnBytes;
        var job=keep?Promise.resolve({blob:file,w:W,h:H,axis:"",scaled:false}):processImage(img,pos||"center");
        return job.then(function(o){
          var notes=[],issues=[],level="ok";
          if(o.axis) notes.push("Recortada a 3:4 (llegó en "+W+"×"+H+"). Revisa el encuadre.");
          else if(o.scaled) notes.push("Reducida de "+W+"×"+H+".");
          if(!keep&&ext!=="jpg"&&ext!=="jpeg") notes.push("Convertida a JPG.");
          if(o.w<PHOTO.minW||o.h<PHOTO.minH){ issues.push("Queda de "+o.w+"×"+o.h+" px; lo ideal es 1200×1600 o más, puede verse borrosa"); level="warn"; }
          if(!o.blob||o.blob.size>PHOTO.maxBytes){ issues.push("No se pudo dejar en menos de 2 MB"); level="bad"; }
          if(o.blob){ upFiles[key]=o.blob; blobs.put(key,o.blob,file); askPersist(); }
          return {name:file.name,ext:"jpg",w:o.w,h:o.h,bytes:o.blob?o.blob.size:file.size,
            url:o.blob?URL.createObjectURL(o.blob):"",level:level,issues:issues,notes:notes,
            crop:o.axis?{axis:o.axis,pos:pos||"center"}:null,color:"",target:"",key:key,src:""};
        });
      });
    }
    function addFiles(list){
      var files=Array.prototype.slice.call(list).filter(function(f){ return f.size>0; });
      if(!files.length) return;
      drop.classList.add("busy"); dropMsg.textContent="Preparando "+files.length+" foto"+(files.length>1?"s":"")+"…";
      Promise.all(files.map(function(f){ return inspect(f); })).then(function(res){

    /* Mover el encuadre recorta otra vez desde la original guardada en el

    function recrop(f,pos){

        return inspect(file,pos).then(function(r){
          delete busyKeys[oldKey];
          if(oldUrl) URL.revokeObjectURL(oldUrl);
          ["ext","w","h","bytes","url","level","issues","notes","crop","key"].forEach(function(k){ f[k]=r[k]; });
          f.src=""; renameAll(); save(); paintShots(); paintPanel(); paintList();
        });
      });
    }

  /* ---------- panel lateral ---------- */
  /* ---------- pasos de la captura ----------
     Una barra arriba del formulario: cada paso dice si le falta algo
     obligatorio (rojo), algo recomendado (ámbar) o si ya está (palomita),
     y al tocarlo lleva a esa sección. */
  var stepHost=null;
  function steps(p){
    var vl=variantList(p);
    var okp=p.photos.filter(function(f){ return f.level!=="bad"; });
    var faltaQty=vl.some(function(x){ return x.v.qty===""||x.v.qty===null; });
    var faltaSku=vl.some(function(x){ return !x.v.sku.trim(); });
    var fotosReq=!okp.length||p.photos.some(function(f){ return f.level==="bad"; });
    return [
      {id:"sec1",t:"Identidad",s:(!p.title.trim()||!(Number(p.price)>0))?"req":(!p.category||!p.body.trim())?"rec":"ok"},
      {id:"sec2",t:"Color y talla",s:(!p.colors.length||!p.sizes.length||faltaQty||faltaSku)?"req":"ok"},
      {id:"sec3",t:"Ficha técnica",s:(!p.material.trim()||!p.fit||!p.care.trim())?"rec":"ok"},
      {id:"sec4",t:"Fotos",s:fotosReq?"req":okp.length<2?"rec":"ok"},
      {id:"sec5",t:"Etiquetas",s:p.tags.length?"ok":"rec"}
    ];
  }
  function paintSteps(){
    var p=cur(); if(!p||!stepHost) return;
    stepHost.innerHTML="";
    steps(p).forEach(function(st,i){
      stepHost.appendChild(h("button",{class:"step ghost "+st.s,
        title:st.s==="ok"?"Completo":st.s==="req"?"Le falta algo obligatorio":"Le falta algo recomendado",
        onclick:function(){ var el=document.getElementById(st.id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
      },[h("span",{class:"n",text:st.s==="ok"?"✓":String(i+1)}),h("span",{text:st.t})]));
    });
  }
  function newProduct(){
    /* La prenda de ejemplo sobra en cuanto hay una real. */
    state.products=state.products.filter(function(x){ return !x.demo; });
    var p=blank(); state.products.push(p); state.active=p.id; save(); paintAll();
    var el=document.querySelector('#main input[type="text"]'); if(el) el.focus();
    window.scrollTo(0,0);
  }

  var panelHost=null;
  function panelNode(){ panelHost=h("div",{class:"panel"}); fillPanel(); return panelHost; }
  function paintPanel(){ paintSteps(); if(panelHost) fillPanel(); }
  function fillPanel(){
    var p=cur(); if(!p||!panelHost) return;
    panelHost.innerHTML="";
    var a=audit(p);
    var st=steps(p), pct=Math.round(st.reduce(function(t,x){ return t+(x.s==="ok"?1:x.s==="rec"?0.6:0); },0)/st.length*100);
    var C=2*Math.PI*26, ring=h("div",{class:"ring"+(pct===100?" done":"")});
    ring.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" cx="32" cy="32" r="26" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct/100)).toFixed(1)+'"/></svg>';
    ring.appendChild(h("div",{},[h("b",{text:pct+"%"}),h("span",{text:a.req.length?(a.req.length===1?"Falta 1 cosa obligatoria":"Faltan "+a.req.length+" cosas obligatorias"):pct===100?"Completa":"Lista para publicar"})]));
    panelHost.appendChild(h("div",{class:"card"},[ring]));

  /* ---------- modal genérico ---------- */
  function modal(title,bodyNodes,footNodes){
    var veil=h("div",{class:"veil"});
    var m=h("div",{class:"modal"},[
      h("div",{class:"mh"},[h("h3",{text:title})]),
      h("div",{class:"mb"},bodyNodes),
      h("div",{class:"mf"},(footNodes||[]).concat([h("button",{class:"ghost",text:"Cerrar",onclick:function(){ veil.remove(); }})]))
    ]);
    veil.appendChild(m);
    veil.addEventListener("click",function(e){ if(e.target===veil) veil.remove(); });
    function onEsc(e){ if(e.key==="Escape"){ veil.remove(); document.removeEventListener("keydown",onEsc); } }

    document.body.appendChild(veil);

      cl.appendChild(h("div",{class:"addform"},[

        h("div",{class:"conseq"},[h("b",{text:"Qué pasa al agregar: "}),document.createTextNode("la prenda se puede capturar, pero en la tienda el círculo de color se verá beige hasta que Nexium lo programe en el tema. Sale en el reporte de pendientes.")])
      ]));

        h("p",{text:"Los diez primeros existen en el diseño. Los que agregues quedan marcados como pendientes de programar."}),

  function esc(v){
    v=v===null||v===undefined?"":String(v);
    return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }
  function rowsToCSV(rows){ return rows.map(function(r){ return r.map(esc).join(","); }).join("\r\n"); }

  var SHOPIFY_COLS=["Handle","Title","Body (HTML)","Vendor","Type","Tags","Published",
    "Option1 Name","Option1 Value","Option2 Name","Option2 Value",
    "Variant SKU","Variant Barcode","Variant Inventory Tracker","Variant Inventory Qty","Variant Inventory Policy",
    "Variant Fulfillment Service","Variant Price","Variant Compare At Price",
    "Variant Requires Shipping","Variant Taxable","Image Src","Image Position","Image Alt Text","Variant Image","Status",
    "Material (product.metafields.custom.material)",
    "Fit (product.metafields.custom.fit)",
    "Cuidados (product.metafields.custom.care_instructions)",
    "Info modelo (product.metafields.custom.model_info)",
    "Medidas (product.metafields.custom.measurements)",
    "Origen (product.metafields.custom.origin)"];

  function shopifyCSV(){
    var rows=[SHOPIFY_COLS.slice()];
    state.products.filter(function(p){ return !p.demo; }).forEach(function(p){
      var handle=slug(p.title)||("prenda-"+p.id),vl=variantList(p);
      if(!vl.length) return;
      /* Fotos ya subidas: una por fila (en las filas de variantes y, si
         sobran, en filas extra solo con Handle + imagen). Cada variante
         apunta a la primera foto de su color. */
      var imgs=p.photos.filter(function(f){ return f.level!=="bad"&&f.src; });
      function alt(f){ return p.title+(f.color?" — "+f.color:""); }
      function colorImg(c){ var m=imgs.filter(function(f){ return f.color===c; })[0]; return m?m.src:""; }
      vl.forEach(function(x,i){
        var f=(i===0),r=[];
        r.push(handle);
        r.push(f?p.title:"");
        r.push(f?(p.body?"<p>"+p.body.replace(/\n+/g,"</p><p>")+"</p>":""):"");
        r.push(f?((p.vendor||"").trim()||"Star Moda"):"");
        r.push(f?p.category:"");
        r.push(f?p.tags.join(", "):"");
        r.push(f?"TRUE":"");
        r.push(f?"Color":""); r.push(x.color);
        r.push(f?"Talla":"");  r.push(x.size);
        r.push(x.v.sku);
        r.push((x.v.barcode||"").trim());
        r.push("shopify");
        r.push(x.v.qty===""?"0":x.v.qty);
        r.push("deny"); r.push("manual");
        r.push(p.price); r.push(p.compareAt||"");
        r.push("TRUE"); r.push("TRUE");
        var im=imgs[i];
        r.push(im?im.src:""); r.push(im?String(i+1):""); r.push(im?alt(im):"");
        r.push(colorImg(x.color));
        r.push(f?"active":"");
        r.push(f?p.material:""); r.push(f?p.fit:""); r.push(f?p.care:"");
        r.push(f?p.modelInfo:""); r.push(f?p.measurements:""); r.push(f?p.origin:"");
        rows.push(r);
      });
      var col=function(n){ return SHOPIFY_COLS.indexOf(n); };
      for(var j=vl.length;j<imgs.length;j++){
        var e=SHOPIFY_COLS.map(function(){ return ""; });
        e[col("Handle")]=handle; e[col("Image Src")]=imgs[j].src;
        e[col("Image Position")]=String(j+1); e[col("Image Alt Text")]=alt(imgs[j]);
        rows.push(e);
      }
    });
    return rowsToCSV(rows);
  }
  function photoCSV(){

      p.photos.forEach(function(f,i){
        rows.push([handle,String(i+1),f.color||"todos",f.target,String(f.w),String(f.h),(f.bytes/1024).toFixed(0),
          f.level==="ok"?"OK":f.level==="warn"?"Revisar":"No sirve",f.src||""]);

    return rowsToCSV(rows);

  /* Las descargas solo funcionan para quien tiene permiso en este artefacto.
     Si no hay permiso, se muestra el texto para copiarlo y mandarlo. */
  var dlP=(window.claude&&typeof window.claude.use==="function")
    ? window.claude.use("downloads").then(function(d){ return d; },function(){ return null; })
    : Promise.resolve(null);
  function deliver(filename,text,mime){
    toast("Descargando "+filename);
    /* Fuera de Claude (Vercel) la descarga normal del navegador funciona. */
    if(!(window.claude&&typeof window.claude.use==="function")){
      try{
        var bom=(mime==="text/csv"||/\.csv$/i.test(filename))?"﻿":"";
        var blob=new Blob([bom+text],{type:(mime||"text/plain")+";charset=utf-8"});
        var a=document.createElement("a");
        a.href=URL.createObjectURL(blob); a.download=filename;
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
      }catch(e){ showText(filename,text); }
      return;
    }
    dlP.then(function(d){
      if(!d||typeof d.save!=="function"){ showText(filename,text); return; }
      d.save({filename:filename,data:text}).catch(function(e){
        if(e&&(e.code==="declined"||e.code==="rate_limited")) return;
        showText(filename,text);
      });
    });
  }
  function showText(filename,text){
    var t=h("textarea",{class:"out",readonly:"readonly"}); t.value=text;
    var status=h("span",{class:"cnt",text:""});
    modal("Copiar: "+filename,[
      h("p",{class:"hint",style:"margin:0 0 6px",text:"La descarga no está disponible en este dispositivo. Copia el texto y mándalo por WhatsApp o correo; se puede volver a cargar desde Respaldo › Pegar respaldo."}),
      t,
      h("div",{style:"display:flex;gap:9px;align-items:center;margin-top:10px"},[
        h("button",{class:"primary",text:"Copiar todo",onclick:function(){
          function ok(){ status.textContent="Copiado"; }
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(ok,function(){ t.focus(); t.select(); status.textContent="Selecciona y copia a mano"; });
          } else { t.focus(); t.select(); try{ document.execCommand("copy"); ok(); }catch(e){ status.textContent="Selecciona y copia a mano"; } }
        }}),
        status
      ])
    ],[]);
  }
